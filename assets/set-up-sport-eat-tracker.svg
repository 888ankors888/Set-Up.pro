<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="260" viewBox="0 0 1500 260" role="img" aria-labelledby="title desc">
<title id="title">Sport Eat Tracker UP</title>
<desc id="desc">A clean transparent Sport Eat Tracker UP wordmark with neon green initials and an upward arrow.</desc>
<defs>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C8FF32"/>
    <stop offset="1" stop-color="#55D923"/>
  </linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#BFC9D2"/>
  </linearGradient>
  <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D6FF38"/>
    <stop offset="1" stop-color="#20D99A"/>
  </linearGradient>
  <filter id="soft" x="-15%" y="-25%" width="130%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.95 0 0 0 0 0.24 0 0 0 .22 0" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Main name: deliberately spaced for clear reading at header size -->
<g font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="800">
  <text x="26" y="166" font-size="137" fill="url(#green)" letter-spacing="-7">S</text>
  <text x="112" y="166" font-size="112" fill="#FFFFFF" letter-spacing="-4">port</text>
  <text x="365" y="166" font-size="137" fill="url(#green)" letter-spacing="-7">E</text>
  <text x="460" y="166" font-size="112" fill="#FFFFFF" letter-spacing="-4">at</text>
  <text x="615" y="166" font-size="137" fill="url(#green)" letter-spacing="-7">T</text>
  <text x="720" y="166" font-size="112" fill="#FFFFFF" letter-spacing="-4">racker</text>
</g>

<!-- Slim separator -->
<path d="M25 195 H1085" stroke="#54E9B0" stroke-width="3" stroke-linecap="round" opacity=".85"/>
<path d="M25 195 H420" stroke="url(#green)" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>

<!-- UP monogram: bold, clean and balanced -->
<g font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="900" filter="url(#soft)">
  <text x="1110" y="218" font-size="190" fill="url(#silver)" letter-spacing="-14">UP</text>
</g>

<!-- Upward motion mark, separated from the letterforms for legibility -->
<path d="M1308 70 L1308 40 L1372 40 L1372 15 L1445 77 L1372 77 L1372 70"
      fill="none" stroke="url(#arrow)" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter"/>
<path d="M1125 244 Q1290 220 1470 232" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round"/>
<path d="M1125 244 Q1290 220 1470 232" fill="none" stroke="#BFFF42" stroke-width="2" stroke-linecap="round" opacity=".9"/>
</svg>