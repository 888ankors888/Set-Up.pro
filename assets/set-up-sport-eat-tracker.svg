<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
<title id="title">Sport Eat Tracker UP</title><desc id="desc">Sport Eat Tracker lettering with neon green initials, white italic lettering, an upward arrow and AI accent.</desc>
<defs>
 <linearGradient id="lime" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#c8ff18"/><stop offset=".48" stop-color="#65ed18"/><stop offset="1" stop-color="#00c98a"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#e9edf0"/><stop offset="1" stop-color="#9daab0"/></linearGradient>
 <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#13d7cf"/><stop offset="1" stop-color="#73ffb5"/></linearGradient>
 <filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- light trails -->
<path d="M18 265H1120" stroke="url(#aqua)" stroke-width="5" opacity=".8" filter="url(#glow)"/>
<path d="M45 282H1110" stroke="#31e8be" stroke-width="2" opacity=".5"/>
<g font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="900" filter="url(#shadow)">
 <text x="48" y="232" font-size="158" fill="url(#lime)" stroke="#43d71b" stroke-width="2">S</text>
 <text x="151" y="232" font-size="120" fill="#fff">port</text>
 <text x="374" y="232" font-size="158" fill="url(#lime)" stroke="#43d71b" stroke-width="2">E</text>
 <text x="484" y="232" font-size="120" fill="#fff">at</text>
 <text x="620" y="232" font-size="158" fill="url(#lime)" stroke="#43d71b" stroke-width="2">T</text>
 <text x="735" y="232" font-size="120" fill="#fff">racker</text>
</g>
<!-- UP mark -->
<g filter="url(#shadow)">
 <path d="M1190 226 L1237 226 L1265 105 L1317 105 L1272 226 Q1254 286 1191 286 L1148 286 Q1084 286 1101 224 L1127 119 L1180 119 L1157 224 Q1151 247 1174 247 Q1185 247 1190 226Z" fill="url(#silver)" stroke="#d8e1e5" stroke-width="3"/>
 <path d="M1260 102 L1365 102 L1422 158 L1382 158 L1382 252 L1328 252 L1328 158 L1287 158Z" fill="url(#lime)" stroke="#28dca4" stroke-width="3" transform="translate(0,-48)"/>
 <path d="M1365 119 L1510 119 Q1570 119 1550 181 L1540 215 Q1529 252 1482 252 L1398 252 L1385 286 L1330 286 L1370 145 Q1377 119 1400 119Z" fill="url(#silver)" stroke="#d8e1e5" stroke-width="3"/>
 <path d="M1420 160 L1480 160 Q1500 160 1494 181 L1491 193 Q1488 204 1473 204 L1407 204Z" fill="#17242a"/>
</g>
<!-- upward arrow highlight / swoosh -->
<path d="M1085 333 Q1280 258 1555 262 Q1335 281 1085 333Z" fill="url(#lime)" filter="url(#glow)"/>
<path d="M1098 326 Q1302 269 1535 266" fill="none" stroke="#baff20" stroke-width="3"/>
