<g fill="none" stroke="#54f4b5" stroke-width="3" opacity=".95">
 <rect x="1184" y="294" width="30" height="30" rx="6"/><path d="M1192 288v6m14-6v6m-20 36v-6m14 6v-6m-22-22h6m-6 14h6m36-14h-6m6 14h-6"/>
</g><text x="1188" y="315" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#54f4b5">AI</text>
<g fill="#62f6bd"><path d="M1110 72l7 18 18 7-18 7-7 18-7-18-18-7 18-7Z"/><path d="M1160 42l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/><path d="M1080 112l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/></g>
</svg>