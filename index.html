<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2b24;--mu:#6b7a72;--ac:#c75a14;--ac2:#fdeede;--br:#1b3a5c;--on:#fff;--ln:#e3e8e4;--wr:#d9822b;--bad:#c4452f;--k:#e07a2f;--p:#3b73c9;--f:#d9a22b;--c:#c4602f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e6eee9;--mu:#93a39a;--ac:#f19350;--ac2:#3a2a1c;--br:#e6eee9;--on:#1a1209;--ln:#2a3731;--p:#6c9cec;--f:#e5b94e;--c:#e08755}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e6eee9;--mu:#93a39a;--ac:#f19350;--ac2:#3a2a1c;--br:#e6eee9;--on:#1a1209;--ln:#2a3731;--p:#6c9cec;--f:#e5b94e;--c:#e08755}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:12px 0}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{display:block;width:100%;text-align:center;background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:13px;font-weight:600;cursor:pointer}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.d{background:transparent;color:var(--bad);border:1px solid var(--ln)}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 8px 4px 0;font-size:14px;color:var(--tx)}.chk input{width:auto}
.bar{height:9px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.big{font-size:34px;font-weight:700;line-height:1.1}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.m3 b{display:block;font-size:15px}.m3 span{font-size:12px;color:var(--mu)}
.ent{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.ent:first-child{border-top:0}
.ent img,.ph{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--ln)}
.ent div{flex:1;min-width:0}.ent small{color:var(--mu)}
.x{background:none;border:0;color:var(--mu);font-size:20px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:9px 2px 8px;color:var(--mu);font-size:11.5px;cursor:pointer}nav svg{display:block}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 10px}.brand img{height:auto;display:block}.brand span{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--br)}
.brand.big{flex-direction:column;gap:8px;margin:8px 0 18px}.brand.big span{font-size:32px}nav button.on{color:var(--ac);font-weight:700}
.tip{background:var(--ac2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.tip.w2{background:color-mix(in srgb,var(--wr) 15%,transparent)}
.chart{display:flex;align-items:flex-end;gap:3px;height:90px;margin:10px 0;position:relative;overflow-x:auto}
.chart i{flex:1;min-width:6px;background:var(--ac);border-radius:4px 4px 0 0}.chart i.o{background:var(--wr)}
.nv{display:flex;align-items:center;justify-content:space-between;margin:6px 0}.nv button{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 14px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chips button{border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9}
.sp{display:inline-block;width:18px;height:18px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:r 1s linear infinite;vertical-align:-4px;margin-right:8px}@keyframes r{to{transform:rotate(360deg)}}
</style>

<style id="modern-ui">

ng:before{content:'';position:absolute;inset:12px;background:var(--card);border-radius:50%}.ring>div{position:relative;text-align:center}.ring b{font-size:32px;line-height:1.2;display:block}.ring small{color:var(--mu)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.water-drops{display:flex;gap:7px;margin:20px 0}.water-drops i{height:26px;flex:1;background:var(--ln);border-radius:5px 5px 10px 10px}.water-drops i.full{background:#7aaaba}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:22px 0}.week button{border:1px solid var(--ln);background:var(--card);border-radius:16px;padding:12px 4px;cursor:pointer}.week .active{background:var(--ac);color:var(--on);border-color:var(--ac)}.week small,.week b{display:block}.week small{opacity:.7}.tools{display:flex;flex-wrap:wrap;gap:8px}.tools .btn{width:auto}.subtle{color:var(--mu);font-size:13px}.welcome{padding:22px;border-radius:18px;background:var(--ac2);margin-bottom:20px}.mini-chart{display:flex;align-items:end;gap:10px;height:90px;margin-top:16px}.mini-chart div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.mini-chart i{display:block;background:var(--ac);border-radius:5px;margin-bottom:5px;min-height:3px}dialog{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:24px;padding:26px;width:min(480px,92vw)}dialog::backdrop{background:#14271db3;backdrop-filter:blur(4px)}

<style id="food-diary-premium-css">

.nutrition-diary-premium details.food-fit-note[open]>summary:before{transform:rotate(90deg)}

.nutrition-diary-premium .ent.food-fit{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;align-items:center;gap:16px;margin:14px 0;padding:20px 18px 20px 22px;border:1px solid var(--nd-line);border-inline-start:4px solid var(--fit);border-radius:22px;background:var(--nd-tint);box-shadow:0 4px 14px rgba(31,64,56,.025);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.nutrition-diary-premium .ent.food-fit.nd-has-photo{grid-template-columns:48px minmax(0,1fr) auto 44px}
.nutrition-diary-premium .ent.food-fit>img{width:48px;height:48px;object-fit:cover;border-radius:14px;box-shadow:0 2px 6px rgba(20,40,32,.06)}
.nutrition-diary-premium .nd-entry-main{min-width:0}
.nutrition-diary-premium .nd-entry-main>b{display:block;font-size:19px;font-weight:650;letter-spacing:-.035em;line-height:1.3;color:var(--nd-ink);overflow-wrap:anywhere}
.nutrition-diary-premium .nd-entry-meta{display:block;margin-top:6px;color:var(--nd-muted);font-size:12px;line-height:1.5}
.nutrition-diary-premium .food-fit-label{display:block;margin-top:12px;font-size:12px;line-height:1.6}
.nutrition-diary-premium .nd-status{display:inline-flex;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--fit) 11%,transparent);color:var(--nd-tone);font-weight:600;line-height:1.45}
.nutrition-diary-premium .nd-reason{display:block;margin-top:7px;color:var(--nd-muted);font-size:12.5px;line-height:1.6;overflow-wrap:anywhere}
.nutrition-diary-premium .nd-kcal{text-align:right!important;align-self:center;min-width:48px}
.nutrition-diary-premium .nd-kcal>b{display:block;color:var(--nd-ink);font-size:29px;line-height:1.1;letter-spacing:-.045em;font-weight:650;font-variant-numeric:tabular-nums}
.nutrition-diary-premium .nd-kcal>small{display:block;color:var(--nd-muted);font-size:10px;letter-spacing:.09em;text-transform:uppercase;margin-top:6px}
.nutrition-diary-premium button.nd-delete{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid transparent;border-radius:14px;background:rgba(120,140,145,.075);color:var(--nd-muted);cursor:pointer;transition:background .18s ease,color .18s ease}
.nutrition-diary-premium .nd-delete svg{width:18px;height:18px}
.nutrition-diary-premium button.nd-add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;margin-top:28px;padding:15px 20px;background:linear-gradient(120deg,#096e57,#0b8668);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:0 8px 20px rgba(8,121,94,.17);font-size:15px;font-weight:650;line-height:1.4;letter-spacing:-.015em;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,filter .2s ease}
.nutrition-diary-premium .nd-add svg{width:21px;height:21px;flex:none;transition:transform .18s ease}
.nutrition-diary-premium .nd-add[aria-expanded=true] svg{transform:rotate(45deg)}
.nutrition-diary-premium #diary-entry-actions{margin:18px 0 0;padding:18px;border:1px solid var(--nd-line);border-radius:20px;box-shadow:none}
.nutrition-diary-premium :is(button,summary):focus-visible{outline:3px solid color-mix(in srgb,var(--nd-accent) 55%,white);outline-offset:4px}
@media(hover:hover) and (pointer:fine){.nutrition-diary-premium .ent.food-fit:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(31,64,56,.07)}.nutrition-diary-premium .nd-delete:hover{background:#fae8ed;color:#b34b62}.nutrition-diary-premium button.nd-add:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(8,121,94,.22);filter:brightness(1.02)}}
@media(max-width:520px){.card.nutrition-diary-premium,.nutrition-diary-premium{padding:19px 16px;border-radius:24px}.nutrition-diary-premium .food-fit-key{gap:9px 16px;font-size:11.5px}.nutrition-diary-premium .ent.food-fit{padding:17px 12px 17px 15px;gap:10px;grid-template-columns:minmax(0,1fr) auto 44px;border-radius:19px}.nutrition-diary-premium .ent.food-fit.nd-has-photo{grid-template-columns:38px minmax(0,1fr) auto 44px}.nutrition-diary-premium .ent.food-fit>img{width:38px;height:38px;border-radius:11px}.nutrition-diary-premium .nd-entry-main>b{font-size:18px}.nutrition-diary-premium .nd-kcal>b{font-size:26px}.nutrition-diary-premium button.nd-delete{width:44px;height:44px}.nutrition-diary-premium .nd-reason{font-size:12px}.nutrition-diary-premium button.nd-add{font-size:14px;padding-inline:12px}}
:root[data-theme=dark] .nutrition-diary-premium{--nd-pane:rgba(28,40,35,.9);--nd-ink:#e9f1ed;--nd-muted:#acb9b2;--nd-line:rgba(179,207,190,.14);--nd-accent:#9bd9bd;border-color:var(--nd-line)}
:root[data-theme=dark] .nutrition-diary-premium .food-fit-good{--nd-tint:#20392e;--nd-tone:#a6dec6}
:root[data-theme=dark] .nutrition-diary-premium .food-fit-neutral{--nd-tint:#393321;--nd-tone:#ead393}
:root[data-theme=dark] .nutrition-diary-premium .food-fit-bad{--nd-tint:#3b2931;--nd-tone:#efb6c2}
@media(prefers-reduced-motion:reduce){.nutrition-diary-premium *{transition:none!important;animation:none!important}.nutrition-diary-premium .ent.food-fit:hover,.nutrition-diary-premium button.nd-add:hover{transform:none}}

<style id="site-unified-theme">
/* food.pro unified mint / soft-glass theme; CSS only. */
:root,:root[data-theme=light]{--bg:#f5f8f7;--card:rgba(255,255,255,.88);--tx:#202c32;--mu:#65747d;--ac:#08795e;--ac2:#edf8f3;--br:#203a30;--on:#fff;--ln:#dfe9e4;--wr:#b18a36;--bad:#ad4b62;--k:#79ae93;--p:#7fa5c6;--f:#d6b66e;--c:#b89bc0;--site-pane:rgba(255,255,255,.82);--site-field:#f4f8f5;--site-wash:radial-gradient(ellipse at 12% 0%,rgba(159,213,183,.14),transparent 48%);--site-primary:linear-gradient(120deg,#096e57,#0b8668);--site-shadow:0 12px 36px rgba(34,65,58,.045),0 2px 6px rgba(34,65,58,.02);--site-warn:#fff8e9;--site-danger:#fff1f4}
:root[data-theme=dark]{--bg:#111c18;--card:rgba(25,41,33,.94);--tx:#e7f0eb;--mu:#a7b9af;--ac:#95d7b9;--ac2:#243f32;--br:#e1efe6;--on:#11261b;--ln:#334d3e;--wr:#dfc17d;--bad:#efabbc;--k:#8fbd9f;--p:#9ab9d3;--f:#dfc17d;--c:#c8b0ce;--site-pane:rgba(25,41,33,.88);--site-field:#1c3026;--site-wash:radial-gradient(ellipse at 12% 0%,rgba(90,159,121,.1),transparent 48%);--site-primary:linear-gradient(120deg,#95d7b9,#78c8a3);--site-shadow:0 12px 36px rgba(0,0,0,.12);--site-warn:#3a3423;--site-danger:#402a33}
body{background-color:var(--bg);background-image:var(--site-wash);background-attachment:fixed;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;letter-spacing:-.012em}
body h1{font-weight:700;font-size:32px;line-height:1.2;letter-spacing:-.045em}body h2{font-weight:650;font-size:18px;line-height:1.35;letter-spacing:-.025em}body h3{font-weight:650;line-height:1.4;letter-spacing:-.02em}body .mu,body .subtle{color:var(--mu)}body .big{font-weight:650;letter-spacing:-.05em;line-height:1.12}
body .card{background:var(--card);border:1px solid var(--ln);border-radius:26px;padding:24px;box-shadow:var(--site-shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}body .card .card{box-shadow:none}body .welcome{border:1px solid var(--ln);border-radius:20px;background:var(--ac2)}

body #nav{background:var(--site-pane);border-color:var(--ln);box-shadow:0 -4px 24px rgba(34,65,58,.035);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}body #nav button{color:var(--mu)}body #nav button.on{background:var(--ac2);color:var(--ac);border-radius:15px}body .brand:before{background:var(--site-primary);color:var(--on);border-radius:14px;box-shadow:0 5px 14px rgba(8,121,94,.1)}body .brand span{color:var(--br)}
body .week button{background:var(--site-pane);border:1px solid var(--ln);border-radius:15px;color:var(--tx)}body .week button.active{background:var(--ac);color:var(--on);border-color:var(--ac)}body .bar{background:var(--ln);border-radius:999px}body .water-drops i{background:var(--ln)}body .water-drops i.full{background:#78b5a6}body .chart i{background:var(--ac)}body .chart i.o{background:var(--wr)}body .mini-chart i{background:var(--ac)}
body .tip{background:var(--ac2);color:var(--tx);border:1px solid var(--ln);border-radius:17px;box-shadow:none}body .tip.w2{background:var(--site-warn)}body .tag{background:var(--site-pane);border-color:var(--ln);color:var(--mu);border-radius:999px}body .ent:not(.food-fit){background:var(--site-field);border:1px solid var(--ln);border-radius:17px;padding:14px;margin:9px 0}body .ent:not(.food-fit) small{color:var(--mu)}
body dialog{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:26px;padding:24px;box-shadow:0 24px 80px rgba(19,47,34,.18);max-height:90vh;overflow-y:auto;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}body dialog::backdrop{background:rgba(17,35,27,.35);backdrop-filter:blur(5px)}body details.card>summary{cursor:pointer;font-size:17px;font-weight:650;color:var(--ac);line-height:1.5}body #toast{background:#163d30;color:#fff;border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(19,47,34,.16);border-radius:15px}body a{color:var(--ac)}
body :is(button,input,select,textarea,summary,a):focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 55%,white);outline-offset:3px}
@media(hover:hover) and (pointer:fine){body .btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(8,121,94,.15);filter:brightness(1.02)}body #nav button:not(:disabled):hover{background:var(--ac2)}body .x:not(.nd-delete):hover{background:var(--site-danger);color:var(--bad)}}
@media(max-width:700px){body h1{font-size:28px}body .card{padding:20px;border-radius:23px}body dialog{padding:20px;border-radius:24px}body .big{font-size:36px}}
@media(prefers-reduced-motion:reduce){body .btn,body input,body select,body textarea,body .x{transition:none!important}body .btn:not(:disabled):hover{transform:none}}

/* ---- расчёт норм ---- */
function targets(p){
  const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  let k=bmr*p.act;
  if(p.goal==='lose')k*=0.85;else if(p.goal==='gain')k*=1.1;
  k=Math.max(k,p.sex==='m'?1500:1200);
  const pr=p.w*(p.goal==='maintain'?1.5:1.8),fa=p.w*0.9;
  return{k:r0(k),p:r0(pr),f:r0(fa),c:Math.max(0,r0((k-pr*4-fa*9)/4))};
}
const tot=k=>S.entries.filter(e=>e.date===k).reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,f:a.f+e.f,c:a.c+e.c}),{k:0,p:0,f:0,c:0});

/* ---- анкета ---- */
const HL=['Диабет','Давление','ЖКТ','Щитовидка','Аллергии/непереносимость','Беременность/ГВ'];
function formView(){
  const p=S.profile||{sex:'f',age:30,h:165,w:65,tw:60,act:1.375,goal:'lose',health:[],notes:'',pw:8,pl:18};
  return `<h1>${S.profile?'Профиль':'Давайте знакомиться'}</h1><div class="mu">Анкета нужна, чтобы рассчитать вашу суточную норму КБЖУ.</div>
  <div class="card"><h2>О вас</h2>
  <div class="row"><div><label>Пол</label><select id="sex"><option value="f" ${p.sex==='f'?'selected':''}>Женский</option><option value="m" ${p.sex==='m'?'selected':''}>Мужской</option></select></div><div><label>Возраст</label><input id="age" type="number" value="${p.age}"></div></div>
  <div class="row"><div><label>Рост, см</label><input id="h" type="number" value="${p.h}"></div><div><label>Вес, кг</label><input id="w" type="number" step="0.1" value="${p.w}"></div></div>
  <label>Активность</label><select id="act">${[[1.2,'Сидячая, почти без тренировок'],[1.375,'Лёгкая: 1–3 тренировки в неделю'],[1.55,'Средняя: 3–5 тренировок'],[1.725,'Высокая: ежедневные нагрузки']].map(a=>`<option value="${a[0]}" ${a[0]==p.act?'selected':''}>${a[1]}</option>`).join('')}</select></div>
  <div class="card"><h2>Цель</h2>
  <select id="goal"><option value="lose" ${p.goal==='lose'?'selected':''}>Снизить вес</option><option value="maintain" ${p.goal==='maintain'?'selected':''}>Поддерживать вес</option><option value="gain" ${p.goal==='gain'?'selected':''}>Набрать вес/мышцы</option></select>
  <label>Желаемый вес, кг</label><input id="tw" type="number" step="0.1" value="${p.tw}"></div>
  <div class="card"><h2>Здоровье</h2>${HL.map(x=>`<label class="chk"><input type="checkbox" class="hl" value="${x}" ${p.health.includes(x)?'checked':''}>${x}</label>`).join('')}

Верни ТОЛЬКО JSON: {"name":"название блюда","items":[{"n":"продукт","g":число}],"g":общий вес г,"k":ккал,"p":белки г,"f":жиры г,"c":углеводы г,"conf":"низкая|средняя|высокая","verdict":"1-2 предложения: оценка блюда для цели и здоровья пользователя","day":"1-2 предложения: что съесть на остаток дня с учётом оставшихся ккал и БЖУ"}. Если на фото нет еды, верни name пустой строкой и нули.`;
    const opts={modelTier:'default'};
    const lim=sample.limits?await sample.limits():{images:true};

}

function stats(p){
  const t=targets(S.profile),days={};
  S.entries.filter(e=>e.date>=p.from&&e.date<=p.to).forEach(e=>{const d=days[e.date]=days[e.date]||{k:0,p:0,f:0,c:0};['k','p','f','c'].forEach(i=>d[i]+=e[i])});
  const ks=Object.keys(days).sort(),n=ks.length,sum=i=>ks.reduce((a,k)=>a+days[k][i],0);
  const dishes={};S.entries.filter(e=>e.date>=p.from&&e.date<=p.to).forEach(e=>dishes[e.name]=(dishes[e.name]||0)+1);
  return{t,days,ks,n,avg:{k:n?sum('k')/n:0,p:n?sum('p')/n:0,f:n?sum('f')/n:0,c:n?sum('c')/n:0},ok:ks.filter(k=>Math.abs(days[k].k-t.k)<=t.k*.1).length,over:ks.filter(k=>days[k].k>t.k*1.1).length,top:Object.entries(dishes).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])};
}
function repCard(p){

  return `<div class="card"><h2>${p.type}: ${esc(p.label)} ${cur?'<span class="mu">(идёт)</span>':''}</h2>

 window.foodDiaryDayAnalyze=async function(){if(D.busy||tab!=='diary'||!S.profile)return;if(!confirm('Отправить блюда выбранного дня, порции, КБЖУ, время записей, ориентиры и цели профиля, включая текущий и целевой вес, в GigaChat для разбора до 1000 символов?'))return;const date=day,key=signature(date),p=S.profile,rows=S.entries.filter(e=>e.date===date);if(rows.length>150){D.error='Слишком много записей для одного разбора';refresh();return}const data={date,as_of:timestamp(),targets:targets(p),profile:{bodyGoal:p.bodyGoal||p.goal,weightKg:p.w??null,targetWeightKg:p.tw??null,nutritionGoals:p.nutritionGoals||[],nutritionGoalSettings:p.nutritionGoalSettings||{}},dishes:rows.map(e=>({name:e.name,grams:e.g,meal:e.meal,time:e.time,k:e.k,p:e.p,f:e.f,c:e.c}))};D.busy=true;D.result=null;D.error='';refresh();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),110000);try{const response=await fetch('https://food-pro-api.onrender.com/api/reports/day',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal,credentials:'omit'}),r=await response.json().catch(()=>null);if(!response.ok){const errors={404:'Дневной разбор ещё публикуется.',413:'Слишком много данных.',422:'Проверьте дату, время устройства, КБЖУ и порции.',429:'Сервер занят или достигнут лимит. Повторите позже.',502:'ИИ не подготовил корректный разбор до 1000 символов. Повторите запрос.',503:'ИИ-сервис временно недоступен.'};throw Error(errors[response.status]||'Ошибка API: '+response.status)}if(!r||!['text','comment','advice','advice_title'].every(k=>typeof r[k]==='string'&&r[k].trim())||Array.from(r.text).length>1000||r.text!=='Комментарий по текущему приёму пищи\n'+r.comment+'\n\n'+r.advice_title+'\n'+r.advice||r.date!==date)throw Error('Ответ не соответствует двум разделам или лимиту 1000 символов');if(day!==date||signature(date)!==key)throw Error('Данные изменились во время разбора. Повторите запрос.');D.result=r;D.key=key}catch(e){D.error=e.name==='AbortError'?'Время ожидания истекло. Повторите запрос.':e instanceof TypeError?'Нет соединения с сервером. Повторите позже.':e.message}finally{clearTimeout(timer);D.busy=false;refresh()}};
 const oldRender=render;render=function(){oldRender();mount()};mount();
})();
</script>
<script>
(() => {
 const trainingIcon='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="8" width="4" height="8" rx="1"/><rect x="6" y="6" width="3" height="12" rx="1"/><path d="M9 12h6"/><rect x="15" y="6" width="3" height="12" rx="1"/><rect x="18" y="8" width="4" height="8" rx="1"/></svg>';
 const TYPES={walk:'Ходьба',run:'Бег',bike:'Велосипед',strength:'Силовая',mobility:'Подвижность',other:'Другое'},WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 let date=today(),busy=false,error='',reportDate=today(),reportKind='week';
 const empty=()=>({version:1,profile:null,entries:[],plan:null}),data=()=>S.sports||empty();
 const key=()=>JSON.stringify([S.profile?.age,S.profile?.bodyGoal||S.profile?.goal,S.profile?.health,data().profile]);
 const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&Number.isFinite(dt(d).getTime())&&dk(dt(d))===d;
 const num=(v,max)=>Number.isFinite(v)&&v>=0&&v<=max;
 function profileOK(p){return p&&typeof p.enabled==='boolean'&&['beginner','regular','experienced'].includes(p.level)&&['activity','strength','endurance','muscle','mobility'].includes(p.goal)&&['home','gym','outdoor'].includes(p.place)&&['none','yes','unsure'].includes(p.restrictions)&&Number.isInteger(p.minutes)&&p.minutes>=10&&p.minutes<=90&&typeof p.equipment==='string'&&p.equipment.length<=200&&Array.isArray(p.days)&&p.days.length>=1&&p.days.length<=5&&new Set(p.days).size===p.days.length&&p.days.every(d=>Number.isInteger(d)&&d>=0&&d<=6)}
 function planOK(p){return p&&typeof p.summary==='string'&&p.summary.length<=600&&typeof p.progression==='string'&&p.progression.length<=500&&Array.isArray(p.warnings)&&p.warnings.length<=6&&p.warnings.every(x=>typeof x==='string'&&x.length<=2000)&&Array.isArray(p.sessions)&&p.sessions.length>=1&&p.sessions.length<=5&&p.sessions.every(s=>Number.isInteger(s.weekday)&&s.weekday>=0&&s.weekday<=6&&typeof s.title==='string'&&s.title.length<=120&&TYPES[s.kind]&&Number.isInteger(s.minutes)&&s.minutes>=5&&s.minutes<=90&&['light','moderate'].includes(s.intensity)&&Array.isArray(s.exercises)&&s.exercises.length<=6&&s.exercises.every(e=>typeof e.name==='string'&&e.name.length<=100&&Number.isInteger(e.sets)&&num(e.sets,5)&&typeof e.repetitions==='string'&&e.repetitions.length<=40&&typeof e.instruction==='string'&&e.instruction.length<=300))}
 const idOK=id=>typeof id==='string'&&/^[-\w]{1,80}$/.test(id);
 window.sportsValidateImport=function(v){if(v==null)return empty();if(v.version!==1||!Array.isArray(v.entries)||v.entries.length>20000||(v.profile&&!profileOK(v.profile))||v.entries.some(e=>!e||!idOK(e.id)||!validDate(e.date)||e.date>today()||!TYPES[e.kind]||typeof e.name!=='string'||!e.name||e.name.length>160||!num(e.minutes,1440)||e.minutes<=0||!strengthMetadataOK(e)||!['distance','sets','reps','weight'].every(k=>e[k]===null||num(e[k],10000))||!['sets','reps'].every(k=>e[k]===null||Number.isInteger(e[k]))||(e.effort!=null&&(!Number.isInteger(e.effort)||e.effort<1||e.effort>10))||typeof e.notes!=='string'||e.notes.length>2000||(e.sessionId!==null&&!idOK(e.sessionId)))||new Set(v.entries.map(e=>e.id)).size!==v.entries.length||(v.plan&&(!planOK(v.plan)||!validDate(v.plan.start)||typeof v.plan.signature!=='string'||typeof v.plan.accepted!=='boolean'||v.plan.sessions.some(s=>!idOK(s.id)))))throw Error('Некорректные спортивные данные');return JSON.parse(JSON.stringify(v))};
 function store(v){try{sportsValidateImport(v);const next={...S,sports:v};localStorage.setItem('nt1',JSON.stringify(next));S=next;return true}catch(e){toast('Не удалось сохранить спортивные данные');return false}}
 const input=(id,label,value,type='text',extra='')=>`<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value??'')}" ${extra}>`;
 const select=(id,label,choices,value)=>`<label for="${id}">${label}</label><select id="${id}">${choices.map(([v,t])=>`<option value="${v}" ${v===value?'selected':''}>${t}</option>`).join('')}</select>`;
 function form(){const p=data().profile||{enabled:false,level:'beginner',goal:'activity',place:'home',equipment:'Без инвентаря',minutes:25,days:[0,2,4],restrictions:'unsure'};return `<section class="card" id="sport-form"><h2>Физическая подготовка и спортивные цели</h2><label class="chk"><input id="sp-enabled" type="checkbox" ${p.enabled?'checked':''}>Включить спортивную программу</label>${select('sp-level','Опыт',[['beginner','Начинаю / после перерыва'],['regular','Регулярные занятия'],['experienced','Опытный']],p.level)}${select('sp-goal','Цель',[['activity','Больше двигаться'],['strength','Сила'],['endurance','Выносливость'],['muscle','Набор мышц'],['mobility','Подвижность']],p.goal)}${select('sp-place','Место',[['home','Дом'],['gym','Зал'],['outdoor','Улица']],p.place)}${input('sp-equipment','Инвентарь',p.equipment,'text','maxlength="200"')}${input('sp-minutes','Максимум минут на занятие',p.minutes,'number','min="10" max="90"')}<label>Доступные дни: 1–5</label>${WD.map((d,i)=>`<label class="chk"><input class="sp-day" type="checkbox" value="${i}" ${p.days.includes(i)?'checked':''}>${d}</label>`).join('')}${select('sp-restrictions','Травмы, боль, симптомы при нагрузке, ограничения врача, беременность/послеродовой период или заболевания, требующие согласования?',[['unsure','Не уверен(а) — сначала консультация'],['yes','Да — сначала консультация'],['none','Нет известных ограничений']],p.restrictions)}<p class="subtle">ИИ-программа доступна взрослым 18–85 лет без известных ограничений; не заменяет обследование и реабилитацию. Отметки диабета, давления, беременности/ГВ в основной анкете блокируют генерацию. Ручной дневник доступен независимо.</p></section>`}
 const oldForm=formView;formView=function(){return oldForm().replace('<button class="btn" onclick="saveForm()">',form()+'<button class="btn" onclick="saveForm()">')};
 const oldSave=saveForm;saveForm=function(){if(!document.getElementById('sport-form'))return oldSave();const val=id=>document.getElementById('sp-'+id).value,p={enabled:document.getElementById('sp-enabled').checked,level:val('level'),goal:val('goal'),place:val('place'),equipment:val('equipment').trim(),minutes:Number(val('minutes')),days:[...document.querySelectorAll('.sp-day:checked')].map(e=>Number(e.value)),restrictions:val('restrictions')};if(!p.enabled){if(!p.days.length)p.days=[0,2,4];if(!Number.isInteger(p.minutes)||p.minutes<10||p.minutes>90)p.minutes=25}if(!profileOK(p)){toast('Проверьте спортивную анкету: 1–5 дней, 10–90 минут');return}const previous=S.profile;oldSave();if(S.profile&&S.profile!==previous&&store({...data(),profile:p}))render()};
 function sessionDate(p,s){const d=dt(p.start);d.setDate(d.getDate()+(s.weekday-(d.getDay()+6)%7+7)%7);return dk(d)}
 const active=()=>{const p=data().plan;return p&&p.accepted&&p.signature===key()?p:null};
 const rows=d=>data().entries.filter(e=>e.date===d);
 const stats=entries=>({minutes:entries.reduce((s,e)=>s+e.minutes,0),count:entries.length,days:new Set(entries.map(e=>e.date)).size});
 window.sportsGo=function(t){if(!['sport','training'].includes(t))return;tab='training';date=today();render();if(t==='sport')document.getElementById('training-sport-program')?.scrollIntoView({behavior:'smooth',block:'start'});else scrollTo(0,0)};
 window.sportsDate=function(d){if(!validDate(d)||d>today())return;date=d;render()};
 window.sportsShift=function(n){if(![-1,1].includes(n))return;const d=dt(date);d.setDate(d.getDate()+n);sportsDate(dk(d))};
 function todayBlock(){const t=stats(rows(today())),p=active(),planned=p?p.sessions.filter(s=>sessionDate(p,s)===today()):[];return `<section class="card"><h2>Активность за день</h2><p>${t.minutes} мин · ${t.count} записей</p>${planned.map(s=>'<p>В плане: '+esc(s.title)+' · '+s.minutes+' мин</p>').join('')}<div class="row"><button class="btn" onclick="sportsOpen()">Добавить активность</button><button class="btn s" onclick="sportsGo('sport')">Спорт</button></div><p class="subtle">План не считается выполнением. Калории активности не прибавляются к ориентиру питания.</p></section>`}
 function diary(){const list=rows(date),t=stats(list),start=dt(date);start.setDate(start.getDate()-(start.getDay()+6)%7);const week=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const k=dk(d);return {date:k,...stats(rows(k))}}),max=Math.max(1,...week.map(d=>d.minutes));return `<h1>Дневник тренировок</h1><div class="nv"><button onclick="sportsShift(-1)">←</button><b>${esc(fmt(date))}</b><button onclick="sportsShift(1)" ${date>=today()?'disabled':''}>→</button></div>${input('sport-date','Выбранный день',date,'date',`max="${today()}" onchange="sportsDate(this.value)"`)}<section class="card"><h2>Активность дня</h2><p>${t.minutes} мин · ${t.count} записей</p><button class="btn" onclick="sportsOpen()">Добавить активность</button></section><details class="card"><summary>Активность за неделю</summary><div class="chart">${week.map(d=>`<i style="height:${Math.max(2,d.minutes/max*100)}%;opacity:${d.count?1:0.2}" title="${d.date}: ${d.count?d.minutes+' мин':'нет записей'}"></i>`).join('')}</div><div class="week">${week.map((d,i)=>`<button onclick="sportsDate('${d.date}')" ${d.date>today()?'disabled':''}>${WD[i]}<small>${d.count?d.minutes+' мин':'—'}</small></button>`).join('')}</div></details><section class="card">${list.map(e=>`<div class="ent"><div><b>${esc(e.name)}</b><br><small>${TYPES[e.kind]}${e.muscleGroup?' · '+esc(STRENGTH_GROUPS[e.muscleGroup].label):''} · ${e.minutes} мин${[['distance',' км'],['sets',' подходов'],['reps',' повторений'],['weight',' кг']].map(([k,u])=>e[k]===null?'':' · '+e[k]+u).join('')}</small><p class="subtle">${esc(e.notes)}</p><button class="x" onclick="sportsOpen('${e.id}')">Изменить</button><button class="x" onclick="sportsDelete('${e.id}')">Удалить</button></div></div>`).join('')||'Записей нет; это не означает отсутствие активности.'}</section>`}
 const STRENGTH_GROUPS={
  chest:{label:'Грудь',items:[['pushup','Отжимания'],['bench_press','Жим штанги лёжа'],['db_bench','Жим гантелей лёжа']]},
  back:{label:'Спина',items:[['pullup','Подтягивания'],['pulldown','Тяга верхнего блока'],['row','Горизонтальная тяга']]},
  shoulders:{label:'Плечи',items:[['shoulder_press','Жим гантелей сидя'],['lateral_raise','Разведения гантелей в стороны']]},
  biceps:{label:'Бицепс',items:[['biceps_curl','Сгибание рук с гантелями'],['hammer_curl','Молотковые сгибания']]},
  triceps:{label:'Трицепс',items:[['triceps_pushdown','Разгибание рук на блоке'],['triceps_extension','Разгибание рук с гантелью']]},
  legs:{label:'Ноги',items:[['squat','Приседания'],['leg_press','Жим ногами'],['leg_curl','Сгибание ног в тренажёре']]},
  glutes:{label:'Ягодицы',items:[['glute_bridge','Ягодичный мост'],['hip_thrust','Подъём таза с опорой на скамью']]},
  core:{label:'Пресс и корпус',items:[['plank','Планка'],['crunch','Скручивания'],['dead_bug','Мёртвый жук']]},
  other:{label:'Другое / своё упражнение',items:[]}
 };
 function strengthMetadataOK(e){if(e.muscleGroup==null&&e.exerciseId==null)return true;const g=typeof e.muscleGroup==='string'&&Object.prototype.hasOwnProperty.call(STRENGTH_GROUPS,e.muscleGroup)?STRENGTH_GROUPS[e.muscleGroup]:null;return e.kind==='strength'&&!!g&&(e.exerciseId==='custom'||g.items.some(x=>x[0]===e.exerciseId))}
 function strengthChoice(group,id,name){const g=typeof group==='string'&&Object.prototype.hasOwnProperty.call(STRENGTH_GROUPS,group)?STRENGTH_GROUPS[group]:null;if(!g)throw Error('Выберите группу мышц');const item=g.items.find(x=>x[0]===id);if(!item&&id!=='custom')throw Error('Выберите упражнение из текущей группы');const title=item?item[1]:String(name||'').trim();if(!title||title.length>160)throw Error('Введите название своего упражнения');return {muscleGroup:group,exerciseId:id,name:title}}
 function exerciseOptions(group){return [['','Выберите упражнение'],...(STRENGTH_GROUPS[group]?.items||[]),['custom','Своё упражнение']]}
 window.sportsOpen=function(id='',sessionId=''){
  const old=data().entries.find(e=>e.id===id),p=active(),s=p?.sessions.find(s=>s.id===sessionId),e=old||{date:s?sessionDate(p,s):tab==='training'?date:today(),kind:s?.kind||'walk',name:s?.title||'',minutes:s?.minutes||20,distance:null,sets:null,reps:null,weight:null};
  if(e.date>today()){toast('Будущее занятие нельзя записать выполненным');return}
  let group='',exercise='';if(e.kind==='strength'){if(strengthMetadataOK(e)&&e.muscleGroup){group=e.muscleGroup;exercise=e.exerciseId}else{for(const [k,g] of Object.entries(STRENGTH_GROUPS)){const match=g.items.find(x=>x[1]===e.name);if(match){group=k;exercise=match[0];break}}if(!group&&e.name){group='other';exercise='custom'}}}
  let dialog=document.getElementById('sport-entry');if(!dialog){dialog=document.createElement('dialog');dialog.id='sport-entry';dialog.style.maxHeight='90vh';dialog.style.overflowY='auto';document.body.appendChild(dialog)}
  dialog.innerHTML=`<form><h2>Фактическая активность</h2>${input('se-date','Дата',e.date,'date',`max="${today()}" required`)}${select('se-kind','Вид активности',Object.entries(TYPES),e.kind)}<div id="se-strength">${select('se-group','Группа мышц',[['','Выберите группу'],...Object.entries(STRENGTH_GROUPS).map(([k,g])=>[k,g.label])],group)}<div id="se-exercise-wrap">${select('se-exercise','Упражнение',exerciseOptions(group),exercise)}</div><p class="subtle">Группа нужна для поиска: упражнения могут задействовать несколько групп. Список не является назначением программы. Одна запись — одно упражнение или указанная вами активность.</p></div><div id="se-name-wrap">${input('se-name','Название / своё упражнение',e.name,'text','maxlength="160"')}</div>${input('se-minutes','Фактически выполнено, минут',e.minutes,'number','min="0.1" max="1440" step="0.1" required')}<div id="se-distance-wrap">${input('se-distance','Дистанция, км (необязательно)',e.distance,'number','min="0" max="10000" step="0.1"')}</div><div id="se-strength-numbers">${[['sets','Подходы'],['reps','Повторения в подходе'],['weight','Рабочий вес, кг']].map(([k,label])=>input('se-'+k,label+' (необязательно)',e[k],'number',`min="0" max="10000" step="${k==='weight'?0.1:1}"`)).join('')}</div><p id="se-error" role="status" aria-live="polite"></p><label class="chk"><input id="se-confirm" type="checkbox" required>Активность действительно выполнена</label><div class="row"><button class="btn s" type="button" onclick="document.getElementById('sport-entry').close()">Отмена</button><button class="btn" type="submit">Сохранить</button></div></form>`;
  const node=k=>dialog.querySelector('#se-'+k),val=k=>node(k).value;
  function visibility(){const strong=val('kind')==='strength',custom=val('exercise')==='custom';node('strength').hidden=!strong;node('group').disabled=!strong;node('exercise').disabled=!strong;node('group').required=strong;node('exercise').required=strong;node('strength-numbers').hidden=!strong;for(const k of ['sets','reps','weight'])node(k).disabled=!strong;node('distance-wrap').hidden=strong;node('distance').disabled=strong;node('name-wrap').hidden=['walk','run','bike'].includes(val('kind'))||(strong&&!custom);node('name').required=strong&&custom;node('error').textContent=''}
  node('kind').onchange=visibility;
  node('group').onchange=()=>{node('exercise').innerHTML=exerciseOptions(val('group')).map(([id,label])=>`<option value="${id}">${esc(label)}</option>`).join('');node('exercise').value='';visibility()};

 function ringValues(date){const entries=S.sports?.entries||[],list=entries.filter(e=>e.date===date),p=activePlan(),[from,to]=week(date),range=p&&date>=p.start&&date<=shift(p.start,6),planned=range?p.sessions.filter(s=>sessionDate(p,s)===date):[],weekly=p?p.sessions.filter(s=>sessionDate(p,s)>=from&&sessionDate(p,s)<=to):[];return {minutes:list.reduce((sum,e)=>sum+e.minutes,0),minuteGoal:planned.length?planned.reduce((sum,s)=>sum+s.minutes,0):null,completed:planned.filter(s=>list.some(e=>e.sessionId===s.id)).length,sessionGoal:planned.length||null,activeDays:new Set(entries.filter(e=>e.date>=from&&e.date<=to&&e.minutes>0).map(e=>e.date)).size,dayGoal:weekly.length?new Set(weekly.map(s=>sessionDate(p,s))).size:null,rest:!!range&&!planned.length}}
 function ring(value,target,title,color,empty){const percent=target?Math.min(100,Math.max(0,value/target*100)):0;return `<div><div class="ring" style="--progress:${percent}%;--ring-color:${color}" role="img" aria-label="${esc(title)}: записано ${number(value)}${target?' из '+number(target):', '+empty}"><div><b>${number(value)}</b><small>${target?'из '+number(target):esc(empty)}</small></div></div><p>${esc(title)}</p></div>`}
 function mountTraining(){if(tab!=='training'||!S.profile||editing)return;const app=document.getElementById('app'),date=document.getElementById('sport-date')?.value||today();if(!app||!valid(date))return;const v=ringValues(date),empty=v.rest?'День отдыха':'Цель не задана',html=`<section class="card" id="training-activity-rings"><h2>Активность дня</h2><p class="subtle">${esc(fmt(date))}. Цели из принятой программы, созданной по анкете.</p><div class="activity-rings">${ring(v.minutes,v.minuteGoal,'Минуты за день','var(--ac)',empty)}${ring(v.completed,v.sessionGoal,'Занятия программы за день','var(--p)',empty)}${ring(v.activeDays,v.dayGoal,'Дни с активностью за неделю','var(--f)','Нет плана на неделю')}</div><p class="subtle">По внесённым фактам. Неделя — календарная неделя выбранного дня. Цели относятся только к текущей программе, не к архиву; без плана цель не подставляется. Нет записей — неизвестная активность. В день отдыха не нужно закрывать кольца.</p><button class="btn" onclick="sportsOpen()">Добавить активность</button></section>`;const existing=[...app.querySelectorAll('h2')].find(h=>h.textContent.trim()==='Активность дня')?.closest('.card');if(existing&&!document.getElementById('training-activity-rings'))existing.outerHTML=html;if(!document.getElementById('training-weight-history')){const container=document.createElement('section');container.id='training-weight-history';container.innerHTML=weightCard();app.appendChild(container)}}
 function timestamp(){const n=new Date(),o=-n.getTimezoneOffset();return dk(n)+'T'+n.toTimeString().slice(0,8)+(o<0?'-':'+')+String(Math.floor(Math.abs(o)/60)).padStart(2,'0')+':'+String(Math.abs(o)%60).padStart(2,'0')}
 function collect(from,to){const map=new Map(),get=date=>{if(!map.has(date))map.set(date,{date,food_count:0,activity_count:0,k:0,p:0,f:0,c:0,minutes:0,distance:null,strength_count:0,kinds:{}});return map.get(date)};for(const e of S.entries){if(e.date<from||e.date>to)continue;if(!valid(e.date))throw Error('Проверьте даты записей');if(!['k','p','f','c'].every(k=>Number.isFinite(e[k])&&e[k]>=0))throw Error('Проверьте КБЖУ записей');const d=get(e.date);d.food_count++;for(const k of ['k','p','f','c'])d[k]+=e[k]}for(const e of S.sports?.entries||[]){if(e.date<from||e.date>to)continue;if(!valid(e.date))throw Error('Проверьте даты записей');if(!Object.prototype.hasOwnProperty.call(KINDS,e.kind)||!Number.isFinite(e.minutes)||e.minutes<0||(e.distance!=null&&(!Number.isFinite(e.distance)||e.distance<0)))throw Error('Проверьте записи активности');const d=get(e.date);d.activity_count++;d.minutes+=e.minutes;d.kinds[e.kind]=(d.kinds[e.kind]||0)+e.minutes;if(e.distance!=null)d.distance=(d.distance??0)+e.distance;if(e.kind==='strength')d.strength_count++}return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date))}
 function summarize(days){const food=days.filter(d=>d.food_count),sport=days.filter(d=>d.activity_count),totals={k:0,p:0,f:0,c:0};for(const d of food)for(const k in totals)totals[k]+=d[k];const distance=sport.filter(d=>d.distance!==null);return {foodDays:food.length,sportDays:sport.length,foodCount:food.reduce((n,d)=>n+d.food_count,0),sportCount:sport.reduce((n,d)=>n+d.activity_count,0),totals,average:food.length?Object.fromEntries(Object.entries(totals).map(([k,n])=>[k,n/food.length])):null,minutes:sport.reduce((n,d)=>n+d.minutes,0),distance:distance.length?distance.reduce((n,d)=>n+d.distance,0):null}}
 function publicProfile(){const p=S.profile,choices={bodyGoal:['lose','gain','recomp','maintain','reverse','cut'],sportGoal:['activity','strength','endurance','muscle','mobility'],sportLevel:['beginner','regular','experienced']},raw={bodyGoal:p.bodyGoal||p.goal,sportGoal:S.sports?.profile?.goal,sportLevel:S.sports?.profile?.level},out={weightKg:p.w??null,targetWeightKg:p.tw??null,nutritionGoals:(Array.isArray(p.nutritionGoals)?p.nutritionGoals:[]).filter(g=>['calories','protein','sugar','water','fasting','quality','new_food','tracking'].includes(g)),nutritionGoalSettings:{}};for(const k in choices)if(choices[k].includes(raw[k]))out[k]=raw[k];const limits={proteinFactor:[.5,3],addedSugarGrams:[0,200],waterMl:[250,10000],eatingWindowHours:[1,23],newFoodsPerWeek:[1,21],trackingDays:[1,365]};for(const [k,v] of Object.entries(p.nutritionGoalSettings||{}))if(limits[k]&&(v===null||(Number.isFinite(v)&&v>=limits[k][0]&&v<=limits[k][1])))out.nutritionGoalSettings[k]=v;return out}
 const signature=()=>JSON.stringify([R.from,R.to,S.profile,S.entries,S.sports?.entries,S.sports?.plan]);
 function calendar(){return `<section class="card"><h2>Диапазон дат</h2><form onsubmit="combinedReportRange(event)"><div class="row"><div><label for="report-range-from">С</label><input id="report-range-from" type="date" max="${today()}" value="${R.from}" ${R.busy?'disabled':''} required></div><div><label for="report-range-to">По</label><input id="report-range-to" type="date" max="${today()}" value="${R.to}" ${R.busy?'disabled':''} required></div></div><button class="btn s" ${R.busy?'disabled':''}>Применить диапазон</button><p id="report-range-error" role="status"></p></form><p class="subtle">Общий диапазон: ${esc(fmt(R.from))} — ${esc(fmt(R.to))}. До 366 дней включительно.</p></section>`}
 function chart(days,field,count){const byDate=new Map(days.map(d=>[d.date,d])),dates=Array.from({length:daysCount(R.from,R.to)},(_,i)=>shift(R.from,i)),max=Math.max(1,...days.map(d=>d[field]));return `<div class="chart" role="img" aria-label="Показатели по дням выбранного диапазона">${dates.map(date=>{const d=byDate.get(date),known=d&&d[count]>0,value=known?d[field]:0;return `<i style="height:${Math.max(2,value/max*100)}%;opacity:${known?1:.15}" title="${date}: ${known?number(value):'нет записей'}"></i>`}).join('')}</div>`}
 reportView=function(){if(R.result&&R.key!==signature()){R.result=null;R.error='Данные изменились — сформируйте новый разбор'}const header='<h1>Отчёты</h1>'+calendar();let days,t;try{days=collect(R.from,R.to);t=summarize(days)}catch(e){return header+'<p role="status">'+esc(e.message)+'</p>'}const target=targets(S.profile),plan=planMetrics(R.from,R.to);return header+`<section class="card"><h2>Отчёт по питанию</h2>${chart(days,'k','food_count')}<div class="m3"><div><b>${number(t.totals.k)}</b><span>записано ккал</span></div><div><b>${t.foodDays} из ${daysCount(R.from,R.to)}</b><span>дней с записями</span></div><div><b>${number(t.average?.k??null)}</b><span>среднее ккал по дням с записями</span></div></div><p>Средние Б/Ж/У: ${number(t.average?.p??null)} / ${number(t.average?.f??null)} / ${number(t.average?.c??null)} г.</p><p class="subtle">Текущая анкета: ${number(target.k)} ккал · Б/Ж/У ${number(target.p)}/${number(target.f)}/${number(target.c)} г в день. Светлые столбцы — нет записей, не нулевое питание. Средние только по дням с записями; дневник может быть неполным.</p></section><section class="card"><h2>Спортивные отчёты</h2>${chart(days,'minutes','activity_count')}<div class="m3"><div><b>${number(t.minutes)} мин</b><span>по записям</span></div><div><b>${t.sportCount}</b><span>записей активности</span></div><div><b>${t.sportDays}</b><span>дней с записями</span></div></div><p>Дистанция: ${number(t.distance)}${t.distance===null?'':' км'}.</p>${Object.entries(KINDS).map(([kind,label])=>{const value=days.reduce((sum,d)=>sum+(d.kinds[kind]||0),0);return value?'<p>'+label+': '+number(value)+' мин</p>':''}).join('')}${plan?'<p>Текущая программа: '+plan.completed+' из '+plan.planned+' занятий диапазона записаны выполненными.</p>':''}<p class="subtle">Запись упражнения не равна отдельной тренировке. Нет записей — нет данных. Выполнение относится только к текущей программе, не к архиву.</p></section><section class="card" id="combined-ai-report"><h2>Разбор Питания и Активностей через ИИ</h2><p class="subtle">До 2000 символов с пробелами. После согласия сводки диапазона отправляются на сервер; GigaChat получает итоговые показатели и цели, включая текущий/целевой вес. Без названий блюд, фото и медицинских заметок.</p><button class="btn" ${R.busy||!days.length?'disabled':''} onclick="combinedReportAnalyze()">${R.busy?'Разбираю…':'Разбор Питания и Активностей через ИИ'}</button><p role="status" aria-live="polite">${esc(R.error)}</p>${!days.length?'<p>Добавьте записи за выбранные даты.</p>':''}${R.result?'<p style="white-space:pre-wrap">'+esc(R.result.text)+'</p><p class="subtle">'+Array.from(R.result.text).length+'/2000 · '+esc(new Date(R.result.as_of).toLocaleString('ru-RU'))+'</p>':''}<p class="subtle">Ориентировочная аналитика записей, не медицинская рекомендация.</p></section>`};
 window.combinedReportRange=function(event){event.preventDefault();if(R.busy)return;const from=document.getElementById('report-range-from').value,to=document.getElementById('report-range-to').value;if(!valid(from)||!valid(to)||from>to||to>today()||daysCount(from,to)>366){document.getElementById('report-range-error').textContent='Выберите корректный диапазон до 366 дней, не позднее сегодняшнего';return}R.from=from;R.to=to;R.result=null;R.error='';render()};
 window.combinedReportAnalyze=async function(){if(R.busy||tab!=='report')return;const a=document.getElementById('report-range-from'),b=document.getElementById('report-range-to');if((a&&a.value!==R.from)||(b&&b.value!==R.to)){document.getElementById('report-range-error').textContent='Сначала примените выбранный диапазон';return}let days;try{days=collect(R.from,R.to)}catch(e){R.error=e.message;render();return}if(!days.length)return;if(!confirm('Отправить сводки питания и активностей выбранного диапазона и цели анкеты, включая текущий/целевой вес, на сервер для совместного разбора GigaChat до 2000 символов? Названия блюд, фото и медицинские заметки не отправляются.'))return;const key=signature(),payload={date_from:R.from,date_to:R.to,as_of:timestamp(),targets:targets(S.profile),profile:publicProfile(),days,plan:planMetrics(R.from,R.to)};R.busy=true;R.result=null;R.error='';render();const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),110000);try{const response=await fetch('https://food-pro-api.onrender.com/api/reports/combined',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal,credentials:'omit'}),result=await response.json().catch(()=>null);if(!response.ok)throw Error(({404:'Общий разбор ещё публикуется.',422:'Проверьте даты, время устройства и записи.',429:'Лимит запросов или сервер занят.',502:'Не получен корректный ИИ-разбор до 2000 символов.',503:'ИИ-сервис недоступен.'})[response.status]||'Ошибка API: '+response.status);if(typeof result?.text!=='string'||!result.text.trim()||Array.from(result.text).length>2000||result.date_from!==R.from||result.date_to!==R.to)throw Error('Некорректный формат или превышен лимит 2000 символов');if(key!==signature())throw Error('Данные изменились во время запроса — повторите разбор');R.result=result;R.key=key}catch(e){R.error=e.name==='AbortError'?'Время ожидания истекло.':e instanceof TypeError?'Нет соединения с сервером.':e.message}finally{clearTimeout(timer);R.busy=false;render()}};
 const previousRender=render;render=function(){previousRender();mountTraining()};const style=document.createElement('style');style.id='combined-reports-rings';style.textContent='.activity-rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:22px 0}.activity-rings>div{min-width:0;text-align:center}.activity-rings .ring{width:min(100%,144px);height:auto;aspect-ratio:1;margin:auto;background:conic-gradient(var(--ring-color) var(--progress),var(--ln) 0)}.activity-rings .ring b{font-size:28px}.activity-rings .ring small{font-size:11px}.activity-rings p{font-size:13px;line-height:1.4}@media(max-width:520px){.activity-rings{grid-template-columns:1fr}.activity-rings>div{display:flex;align-items:center;gap:18px;text-align:left}.activity-rings .ring{width:104px;flex:none;margin:0}.activity-rings p{font-size:14px}}';document.head.appendChild(style);render();
})();

<script id="diary-today-layout">

 let estimateDate=null;
 const valid=date=>/^\d{4}-\d{2}-\d{2}$/.test(date)&&Number.isFinite(dt(date).getTime())&&dk(dt(date))===date&&date<=today();
 function summary(date){

 <div class="week">${dates.map(d=>`<button class="${d===date?'active':''}" ${d>today()?'disabled':''} aria-pressed="${d===date}" onclick="day='${d}';tab='diary';render()"><small>${dt(d).toLocaleDateString('ru',{weekday:'short'})}</small><b>${dt(d).getDate()}</b><small>${S.entries.some(e=>e.date===d)?'●':'·'}</small></button>`).join('')}</div>
 <div class="dashboard"><section class="card"><div class="topline"><h2>Энергия дня</h2><span class="tag">${Math.round(e.k/t.k*100)}% от ориентира</span></div><div class="energy"><div class="ring" style="--progress:${Math.min(100,e.k/t.k*100)}%"><div><b>${r0(e.k)}</b><small>из ${t.k} ккал</small></div></div><div><div class="mu">${e.k<=t.k?'Осталось':'Сверх ориентира'}</div><div class="big">${r0(Math.abs(t.k-e.k))}</div><div class="mu">ккал</div></div></div><div class="m3">${[['Белки','p','var(--p)'],['Жиры','f','var(--f)'],['Углеводы','c','var(--c)']].map(([n,k,c])=>`<div><span>${n}</span><b>${r0(e[k])} <small class="mu">/ ${t[k]} г</small></b>${bar(e[k],t[k],c)}</div>`).join('')}</div></section>
 <section class="card"><div class="eyebrow">Ежедневные привычки</div><h2>Вода</h2><div class="big">${(water/1000).toFixed(2)} <small class="mu">/ ${(goal/1000).toFixed(goal%1000===0?1:2)} л</small><button type="button" class="water-goal-plus" onclick="foodDiaryWaterGoal()" ${goal+250>10000?'disabled':''} aria-label="Увеличить план воды на выбранный день на 250 мл" title="+250 мл к плану на выбранный день" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin-left:8px;border:1px solid var(--ln);border-radius:10px;background:var(--ac2);color:var(--ac);font-size:20px;cursor:pointer">+</button></div><div class="water-drops">${Array.from({length:8},(_,i)=>`<i class="${water>=goal*(i+1)/8?'full':''}"></i>`).join('')}</div><div class="row"><button class="btn s" onclick="foodDiaryWaterAdd(-250)" aria-label="Убрать 250 мл">− 250</button><button class="btn" onclick="foodDiaryWaterAdd(250)">+ 250 мл</button></div><div class="subtle" style="margin-top:12px">Личная цель, не медицинская норма. Плюс рядом с объёмом увеличивает только план на выбранный день на 250 мл.</div></section></div>`;
 }
 window.foodDiaryWaterAdd=function(amount){if(!valid(day)||![-250,250].includes(amount))return;S.water=S.water||{};S.water[day]=Math.max(0,(S.water[day]||0)+amount);save();render()};
 window.foodDiaryWaterGoal=function(){if(!valid(day))return;const current=(S.waterGoalsByDate||{})[day]||S.waterGoal||2000;if(current+250>10000)return;S.waterGoalsByDate=S.waterGoalsByDate||{};S.waterGoalsByDate[day]=current+250;save();render()};

    if (S.profile && editing) { editing = false; tab = 'goals'; }
    previousRender();
    const button = document.querySelector('#nav button[onclick*="goals"]');
    if (button && !button.querySelector('svg')) button.insertAdjacentHTML('afterbegin', ic('profile'));
  };
  const previousSave = saveForm;
  saveForm = function() {
    const origin = tab, previous = S.profile;
    previousSave();
    if (origin === 'goals' && S.profile && S.profile !== previous) { editing = false; tab = 'goals'; render(); toast('Анкета сохранена'); }
  };
  render();
})();
</script>

<script id="goals-daily-targets">
(() => {
  const previousProfile = profileView;
  const previousGoals = window.foodGoalsPage;
  function targetCard(fragment) {
    const heading = [...fragment.querySelectorAll('h2')].find(node => node.textContent.trim() === 'Ваша норма на день');
    return heading?.closest('.card');
  }
  profileView = function() {
    const template = document.createElement('template');
    template.innerHTML = previousProfile();
    targetCard(template.content)?.remove();
    return template.innerHTML;
  };
  window.foodGoalsPage = function() {
    const template = document.createElement('template');
    template.innerHTML = previousGoals();
    const source = document.createElement('template');
    source.innerHTML = previousProfile();
    const card = targetCard(source.content);
    if (card) {
      const heading = template.content.querySelector('h1');
      if (heading) heading.after(card);
      else template.content.prepend(card);
    }
    return template.innerHTML;
  };
  render();
})();
</script>
