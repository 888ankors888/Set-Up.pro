name: Put My Goals first in menu
on:
  push:
    branches: [main]
    paths: ['.github/workflows/goals-first.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder menu
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          match = re.search(r'const T=\[(.*?)\];', s)
          assert match, 'Navigation list not found'
          item = "['goals','Мои цели']"
          items = match.group(1)
          assert items.count(item) == 1, 'Expected one My Goals item'
          rest = items.replace(item + ',', '', 1) if item + ',' in items else items.replace(',' + item, '', 1)
          replacement = 'const T=[' + item + ',' + rest + '];'
          p.write_text(s[:match.start()] + replacement + s[match.end():], encoding='utf-8')
      - name: Commit menu order
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Put My Goals first in navigation"
          git push origin HEAD:main
