name: Add meal selection cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meal-picker-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check meal-picker.js
      - name: Connect meal cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert 'meal-estimate' in s and '</head>' in s and '</body>' in s
          if 'href="meal-picker.css?v=1"' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="meal-picker.css?v=1">\n</head>', 1)
          if 'src="meal-picker.js?v=1"' not in s:
              s = s.replace('</body>', '<script src="meal-picker.js?v=1"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit meal card integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect meal picker before food description form"
          git push origin HEAD:main
