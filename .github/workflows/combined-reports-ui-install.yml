name: Install activity rings and unified calendar reports
on:
  push:
    branches: [main]
    paths: ['.github/workflows/combined-reports-ui-install.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate new reports and existing interactions
        run: |
          node --check combined-reports-ui.js
          node tests/combined-reports-ui.test.js
          node tests/today-sport-screens.test.js
          node tests/ui-refinements.test.js
          node sports/tests/strength-entry.test.js
      - name: Replace legacy AI widget and connect interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          assert Path('backend/combined_report_api.py').is_file()
          assert 'install_combined_routes' in Path('backend/main.py').read_text()
          p=Path('index.html')
          html=p.read_text()
          assert '</body>' in html and 'training-weight-history' not in html
          assert 'function weightCard(' in html
          legacy=Path('report-ai.js')
          old=legacy.read_text()
          assert 'const R={period:' in old and html.count(old)==1
          stub='// Legacy AI report widget replaced by combined-reports-ui.js.\n'
          html=html.replace(old,stub,1)
          js=Path('combined-reports-ui.js').read_text()
          html=html.replace('</body>','<script>\n'+js+'\n</script>\n</body>',1)
          for script in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html):
              if script.strip():
                  with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
                      f.write(script);f.flush();subprocess.run(['node','--check',f.name],check=True)
          p.write_text(html)
          legacy.write_text(stub)
          PY
      - name: Commit integration and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html report-ai.js
          git rm .github/workflows/combined-reports-ui-install.yml
          git commit -m "Connect activity rings, shared calendar reports, combined AI and training weight history"
          git push origin HEAD:main
