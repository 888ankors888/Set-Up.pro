name: One-time food input cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/food-ui-text-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply exact UI edits and check JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          path = Path('index.html')
          source = path.read_text(encoding='utf-8')
          button = r'''<button\b[^>]*onclick=["']meExample\(\)["'][^>]*>Посмотреть пример</button>'''
          source, count = re.subn(button, '', source)
          assert count == 1, f'Expected one demo button, found {count}; no HTML written'
          old = 'placeholder="2 жареных яйца и бутерброд с сыром"'
          new = 'placeholder="Опишите, что вы скушали, а мы рассчитаем это за вас…"'
          assert source.count(old) == 1, 'Expected one description placeholder; no HTML written'
          source = source.replace(old, new, 1)
          technical = '<p class="subtle">Публичный API, без ввода пароля. Отправляется только описание еды. Новый серверный маршрут /api/food/estimate должен быть опубликован отдельно.</p>'
          assert source.count(technical) == 1, 'Expected one technical paragraph; no HTML written'
          source = source.replace(technical, '', 1)
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', source, flags=re.S)
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8') as temp:
                  temp.write(script)
                  temp.flush()
                  subprocess.run(['node', '--check', temp.name], check=True)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit UI edits and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/food-ui-text-patch.yml
          git commit -m "Simplify meal input: remove demo and technical note"
          git push origin HEAD:main
