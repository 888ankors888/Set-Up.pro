name: Install premium food diary entry design
on:
  push:
    branches: [main]
    paths: ['.github/workflows/food-diary-design-install.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and connect scoped diary component
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          subprocess.run(['node','--check','diary-entry-design.js'],check=True)
          subprocess.run(['node','sports/tests/strength-entry.test.js'],check=True)
          subprocess.run(['node','tests/ui-refinements.test.js'],check=True)
          subprocess.run(['node','tests/today-sport-screens.test.js'],check=True)
          p=Path('index.html')
          html=p.read_text()
          assert 'food-fit-key' in html and 'diary-entry-actions' in html
          assert '</head>' in html and '</body>' in html
          assert 'food-diary-premium-css' not in html and 'food-diary-surface' not in html
          css=Path('diary-entry-design.css').read_text()
          js=Path('diary-entry-design.js').read_text()
          html=html.replace('</head>','<style id="food-diary-premium-css">\n'+css+'\n</style>\n</head>',1)
          html=html.replace('</body>','<script>\n'+js+'\n</script>\n</body>',1)
          for script in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html):
              if script.strip():
                  with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
                      f.write(script);f.flush();subprocess.run(['node','--check',f.name],check=True)
          p.write_text(html)
          PY
      - name: Commit integration and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/food-diary-design-install.yml
          git commit -m "Apply airy glass food diary cards and remove redundant explanation paragraph"
          git push origin HEAD:main
