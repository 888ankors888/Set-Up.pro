name: Water balance layout and diary scroll
on:
  push:
    branches: [main]
    paths: ['.github/workflows/water-balance-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check water-balance.js
      - name: Connect layout assets
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert 'foodDiaryWaterAdd' in s and 'foodDiaryWaterGoal' in s, 'Diary water handlers missing'
          assert '</head>' in s and '</body>' in s
          if 'href="water-balance.css?v=1"' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="water-balance.css?v=1">\n</head>', 1)
          if 'src="water-balance.js?v=1"' not in s:
              s = s.replace('</body>', '<script src="water-balance.js?v=1"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect redesigned water balance and diary top scrolling"
          git push origin HEAD:main
