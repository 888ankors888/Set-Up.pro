name: Connect dark and light themes on design branch
on:
  push:
    branches: [design/setup-emerald-lime]
    paths: ['.github/workflows/connect-two-themes.yml']
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/setup-emerald-lime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and connect theme controller
        shell: python
        run: |
          from pathlib import Path
          import subprocess,re
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip()=='design/setup-emerald-lime'
          subprocess.run(['node','--check','design/theme.js'],check=True)
          for name in ['index.html','workouts.html']:
              p=Path(name);html=p.read_text(encoding='utf-8')
              assert 'design/setup.css?v=1' in html
              assert 'design/theme.js' not in html, 'Theme already connected; review required'
              marker='<link rel="stylesheet" href="design/setup.css?v=1">'
              assert html.count(marker)==1
              before=re.findall(r'<script\b[^>]*>[\s\S]*?</script>',html)
              html=html.replace(marker,marker+'<link rel="stylesheet" href="design/themes.css?v=1"><script src="design/theme.js?v=1"></script>',1)
              after=re.findall(r'<script\b[^>]*>[\s\S]*?</script>',html)
              assert [x for x in after if 'design/theme.js' not in x]==before
              p.write_text(html,encoding='utf-8')
          subprocess.run(['node','--test','workouts/tests/store.test.cjs'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
      - name: Commit theme connections only to design branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html workouts.html
          git rm -- .github/workflows/connect-two-themes.yml
          git commit -m 'design: connect persistent theme switcher to app and workouts'
          git push origin HEAD:design/setup-emerald-lime
