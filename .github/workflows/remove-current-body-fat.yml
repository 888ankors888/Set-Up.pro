name: Remove current body fat input
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-current-body-fat.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove input and preserve profile compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          pending = {}
          for filename in ['index.html', 'goals-ui.js']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r'<div><label for="food-fat-now">.*?</div>', '', text, flags=re.S)
              assert count == 1, f'{filename}: expected one current-fat input, found {count}'
              old = "optional('food-fat-now')"
              assert text.count(old) == 1, f'{filename}: expected one input read'
              text = text.replace(old, '(S.profile?.bodyFatCurrent??null)', 1)
              old_note = 'Процент жира вводится по вашим измерениям, не определяется по фото еды.'
              assert text.count(old_note) == 1
              text = text.replace(old_note, 'Процент жира не определяется по фото еды.', 1)
              assert 'id="food-fat-target"' in text
              assert 'id="food-fat-now"' not in text
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S) if filename.endswith('.html') else [text]
              for js in scripts:
                  if not js.strip():
                      continue
                  with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8') as temp:
                      temp.write(js)
                      temp.flush()
                      subprocess.run(['node', '--check', temp.name], check=True)
              pending[p] = text
          for p, text in pending.items():
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html goals-ui.js
          git rm .github/workflows/remove-current-body-fat.yml
          git commit -m "Remove current body fat field from questionnaire"
          git push origin HEAD:main
