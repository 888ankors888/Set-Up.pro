name: Install selected-day diary action menu
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diary-entry-install.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install diary menu and validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          assert 'MEAL_ESTIMATE_API' in html and 'food-action-layout' in html
          assert 'function drawDiaryActions()' not in html
          assert '</body>' in html
          subprocess.run(['node', '--check', 'diary-entry-ui.js'], check=True)
          js = Path('diary-entry-ui.js').read_text(encoding='utf-8')
          html = html.replace('</body>', '<script>\n' + js + '\n</script>\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit interface and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/diary-entry-install.yml
          git commit -m "Hide Journal navigation and connect selected-day entry actions"
          git push origin HEAD:main
