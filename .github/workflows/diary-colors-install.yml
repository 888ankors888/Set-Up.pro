name: Install diary goal color indicators
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diary-colors-install.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and install color indicators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          subprocess.run(['node','--check','diary-goal-colors.js'],check=True)
          p=Path('index.html')
          html=p.read_text()
          assert 'function entries(' in html and 'function targets(' in html
          assert '</body>' in html and "css.id='diary-goal-colors'" not in html
          js=Path('diary-goal-colors.js').read_text()
          p.write_text(html.replace('</body>','<script>\n'+js+'\n</script>\n</body>',1))
          PY
      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/diary-colors-install.yml
          git commit -m "Connect contextual goal colors to diary entries"
          git push origin HEAD:main
