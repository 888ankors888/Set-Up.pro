name: Remove target body fat input
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-target-body-fat.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove target input and profile label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          pending = {}
          for filename in ['index.html', 'goals-ui.js']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r'<div class="row"><div><label for="food-fat-target">.*?</div></div>', '', text, flags=re.S)
              assert count == 1, f'{filename}: expected one target input'
              old = "optional('food-fat-target')"
              assert text.count(old) == 1
              text = text.replace(old, '(S.profile?.bodyFatTarget??null)', 1)
              profile_label = "${p.bodyFatTarget!=null?' · цель по жиру: '+esc(p.bodyFatTarget)+'%':''}"
              assert text.count(profile_label) == 1
              text = text.replace(profile_label, '', 1)
              old_description = 'Целевой вес или доля жира; без обещания заданного срока.'
              assert text.count(old_description) == 1
              text = text.replace(old_description, 'Целевой вес; без обещания заданного срока.', 1)
              text = text.replace('Процент жира не определяется по фото еды. ', '', 1)
              assert 'id="food-fat-target"' not in text
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S) if filename.endswith('.html') else [text]
              for js in scripts:
                  if not js.strip():
                      continue
                  with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8') as temp:
                      temp.write(js)
                      temp.flush()
                      subprocess.run(['node', '--check', temp.name], check=True)
              pending[p] = text
          for p, text in pending.items():
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html goals-ui.js
          git rm .github/workflows/remove-target-body-fat.yml
          git commit -m "Remove target body fat field and profile display"
          git push origin HEAD:main
