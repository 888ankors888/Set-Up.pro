name: Install combined nutrition activity range analysis API
on:
  push:
    branches: [main]
    paths: ['.github/workflows/combined-report-api-install.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and connect combined API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          ast.parse(Path('backend/combined_report_api.py').read_text())
          p=Path('backend/main.py')
          source=p.read_text()
          assert 'install_combined_routes' not in source
          source+='\nfrom combined_report_api import install_combined_routes\ninstall_combined_routes(app)\n'
          ast.parse(source)
          p.write_text(source)
          PY
      - name: Test validation without GigaChat requests
        run: |
          python3 -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python3 -m unittest discover -s backend/tests -p 'test_combined_report.py' -v
          PYTHONPATH=backend python3 -m unittest discover -s backend/tests -p 'test_sports_normalization.py' -v
      - name: Commit integration and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py
          git rm .github/workflows/combined-report-api-install.yml
          git commit -m "Connect combined nutrition activity analytics with strict 2000 character cap"
          git push origin HEAD:main
