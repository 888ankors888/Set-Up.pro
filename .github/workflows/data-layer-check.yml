name: Check data layer without deployment
on:
  push:
    branches: ['refactor/data-layer']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression tests
        run: |
          node --check data-store.js
          node --check workouts/store.js
          node --test tests/data-store.test.cjs workouts/tests/store.test.cjs tests/workouts-data-layer.test.cjs tests/restore-data.test.cjs
          python -m unittest discover -s tests -p 'test_frontend_build.py' -v
      - name: Build without publication
        run: |
          python scripts/build-frontend.py
          python -c "from pathlib import Path; assert Path('_site/data-store.js').is_file(); assert Path('_site/workouts/store.js').is_file()"
          git diff --exit-code
