name: Connect named meal photos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meal-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect photo stylesheet
        shell: python
        run: |
          from pathlib import Path
          import re, base64
          css = Path('meal-photos.css').read_text(encoding='utf-8')
          photos = re.findall(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', css)
          assert len(photos) == 4
          for photo in photos:
              data = base64.b64decode(photo, validate=True)
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert '</head>' in s
          if 'href="meal-photos.css?v=1"' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="meal-photos.css?v=1">\n</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit photo integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use named user photos on breakfast lunch dinner and snack cards"
          git push origin HEAD:main
