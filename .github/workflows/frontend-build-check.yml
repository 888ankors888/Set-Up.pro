name: Check frontend build without deployment
on:
  push:
    branches: ['refactor/frontend-build']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build without publication
        run: |
          python -m unittest discover -s tests -p 'test_frontend_build.py' -v
          node --test tests/restore-data.test.cjs
          node --test workouts/tests/store.test.cjs
          python scripts/build-frontend.py
          git diff --exit-code
