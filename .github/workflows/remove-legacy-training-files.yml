name: Remove three legacy training frontend files
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-legacy-training-files.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application references and remove approved files
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          targets=['today-sport-screens.js','daily-training.js','daily-training-ai.js']
          own='.github/workflows/remove-legacy-training-files.yml'
          assert all(Path(p).is_file() for p in targets), 'Expected files changed; review required'
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          blocked=[]
          for name in paths:
              if not name or name in targets or name==own:
                  continue
              p=Path(name)
              if not p.is_file():
                  continue
              text=p.read_bytes()
              if b'\0' in text:
                  continue
              matches=[t for t in targets if t.encode() in text]
              if not matches:
                  continue
              is_test='tests' in p.parts or '.test.' in p.name or p.name.startswith('test_')
              is_code=p.suffix in {'.html','.js','.mjs','.cjs','.css','.py','.sh'}
              if is_code and not is_test:
                  blocked.extend(name+' references '+t for t in matches)
              else:
                  print('Retained historical/test/config reference:',name,','.join(matches))
          assert not blocked, 'Application references remain; nothing deleted:\n'+'\n'.join(blocked)
          html=Path('workouts.html').read_text(encoding='utf-8')
          assert 'workouts/store.js' in html and 'workouts/page.js' in html
          assert 'sportQuestionnaire' in Path('goals-sport.js').read_text(encoding='utf-8')
          assert 'function form()' in Path('sports/sports-ui.js').read_text(encoding='utf-8')
          subprocess.run(['node','--check','workouts/store.js'],check=True)
          subprocess.run(['node','--check','workouts/page.js'],check=True)
          subprocess.run(['node','--test','workouts/tests/store.test.cjs'],check=True)
          subprocess.run(['git','rm','--',*targets,own],check=True)
          subprocess.run(['git','diff','--check'],check=True)
      - name: Commit only approved deletions
        shell: python
        run: |
          import subprocess
          expected=sorted(['today-sport-screens.js','daily-training.js','daily-training-ai.js','.github/workflows/remove-legacy-training-files.yml'])
          actual=sorted(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,actual
          status=subprocess.check_output(['git','diff','--cached','--name-status'],text=True)
          assert all(line.startswith('D\t') for line in status.splitlines()),status
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','chore: remove retired sports screen and old daily planner scripts'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
