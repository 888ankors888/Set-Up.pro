name: Connect real nutrition AI
on:
  push:
    branches: [feature/goals-questionnaire]
    paths: [nutrition-goal-ai.js, backend/nutrition_goal_api.py, .github/workflows/connect-nutrition-ai.yml]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/goals-questionnaire
      - name: Validate and connect modules
        shell: python
        run: |
          from pathlib import Path
          import ast, subprocess, re
          subprocess.run(['node','--check','nutrition-goal-ai.js'],check=True)
          ast.parse(Path('backend/nutrition_goal_api.py').read_text())
          p=Path('backend/main.py')
          s=p.read_text()
          hook='from nutrition_goal_api import install_nutrition_goal_routes\ninstall_nutrition_goal_routes(app)'
          if hook not in s:
              s+='\n'+hook+'\n'
          ast.parse(s)
          p.write_text(s)
          p=Path('index.html')
          s=p.read_text()
          assert s.count('</body>')==1
          s=re.sub(r'<script src="nutrition-goal-ai\.js\?v=\d+"></script>\s*','',s)
          s=s.replace('</body>','<script src="nutrition-goal-ai.js?v=1"></script>\n</body>')
          p.write_text(s)
      - name: Commit feature branch integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/main.py index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect GigaChat nutrition questionnaire analysis"
          git push origin HEAD:feature/goals-questionnaire
