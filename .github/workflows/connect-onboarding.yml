name: Connect onboarding to index.html
on:
  push:
    branches: [feature/onboarding]
    paths: ['.github/workflows/connect-onboarding.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  connect:
    if: github.ref == 'refs/heads/feature/onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/onboarding
      - name: Add onboarding script
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = open(p, encoding='utf-8', newline='').read()
          TAG = '<script src="onboarding.js?v=1" defer></script>\n'

          if 'onboarding.js' in s:
              print('onboarding.js is already connected; nothing to change')
              raise SystemExit(0)

          assert 'data-setup-onboarding' in s, 'Welcome markup is missing'
          assert 'onboarding.css' in s, 'onboarding.css link is missing'
          assert s.count('</body>') == 1, 'Expected exactly one </body>'

          s = s.replace('</body>', TAG + '</body>', 1)
          open(p, 'w', encoding='utf-8', newline='').write(s)
      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect onboarding script to index.html"
          git push origin HEAD:feature/onboarding
