name: Publish current frontend to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check frontend
        run: |
          node --check diary-energy.js
          node --check design/theme.js
          node --check design/style-debug.js
          node --check design/neutral-food-diary.js
          node --check design/setup-ui.js
          node --check design/nav-brand.js
          node --check workouts/page.js
          node --test workouts/tests/store.test.cjs
          python -m unittest discover -s tests -p 'test_frontend_build.py' -v
      - name: Prepare public frontend
        run: python scripts/build-frontend.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
