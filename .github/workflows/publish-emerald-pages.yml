name: Publish current design snapshot to Pages
on:
  push:
    branches: [design/setup-emerald-lime]
    paths: ['.github/workflows/publish-emerald-pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/design/setup-emerald-lime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7b46d883d3983b2d65236cb8c483920165eb6bc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend
        run: |
          node --check design/theme.js
          node --check design/setup-ui.js
          node --check workouts/page.js
          node --test workouts/tests/store.test.cjs
      - name: Prepare public frontend only
        shell: python
        run: |
          from pathlib import Path
          import shutil,json
          out=Path('_site');out.mkdir()
          files=[p for pattern in ('*.html','*.css','*.js') for p in Path('.').glob(pattern)]
          files += [p for folder in ('sports','workouts','design') for pattern in ('*.css','*.js') for p in Path(folder).glob(pattern)]
          files += [p for p in Path('assets').rglob('*') if p.suffix.lower() in {'.png','.jpg','.jpeg','.webp','.svg','.ico','.avif','.woff','.woff2'}]
          root=Path('.').resolve()
          for p in files:
              assert not p.is_symlink() and p.resolve().is_relative_to(root),str(p)
              if p.is_file():
                  dest=out/p;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          for name in ('index.html','workouts.html','design/theme.js','design/themes.css','design/setup.css','assets/setup-mark.svg'):
              assert (out/name).is_file(),name
          for p in out.glob('*.html'):
              text=p.read_text(encoding='utf-8')
              p.write_text(text.replace('design/setup-ui.js?v=1','design/setup-ui.js?v=e7b46d8'),encoding='utf-8')
          (out/'.nojekyll').touch()
          (out/'deployment-info.json').write_text(json.dumps({'branch':'design/setup-emerald-lime','commit':'e7b46d883d3983b2d65236cb8c483920165eb6bc'})+'\n',encoding='utf-8')
      - name: Verify Pages source without changing settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=$(gh api 'repos/${{ github.repository }}/pages' --jq '.build_type')
          if [ "$mode" != workflow ]; then
            echo '::error::Select Settings > Pages > Source > GitHub Actions, then rerun this workflow. No Pages settings were changed.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
