name: Publish current frontend to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend
        run: |
          node --check diary-energy.js
          node --check design/theme.js
          node --check design/style-debug.js
          node --check design/neutral-food-diary.js
          node --check design/setup-ui.js
          node --check design/nav-brand.js
          node --check workouts/page.js
          node --test workouts/tests/store.test.cjs
      - name: Prepare public frontend
        shell: python
        run: |
          from pathlib import Path
          import shutil,json,os,re
          from urllib.parse import urlsplit,urlunsplit,parse_qsl,urlencode
          out=Path('_site');out.mkdir()
          files=[p for pattern in ('*.html','*.css','*.js','*.webp') for p in Path('.').glob(pattern)]
          files.append(Path('wellness-background.jpg'))
          files += [p for folder in ('sports','workouts','design') for pattern in ('*.css','*.js') for p in Path(folder).glob(pattern)]
          files += [p for p in Path('assets').rglob('*') if p.suffix.lower() in {'.png','.jpg','.jpeg','.webp','.svg','.ico','.avif','.woff','.woff2'}]
          root=Path('.').resolve()
          for p in files:
              assert not p.is_symlink() and p.resolve().is_relative_to(root),str(p)
              if p.is_file():
                  dest=out/p;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,dest)
          assert (out/'wellness-background.jpg').is_file(), 'Missing wellness background in Pages artifact'
          assert (out/'wellness-background.jpg').stat().st_size > 0, 'Empty wellness background'
          sha=os.environ['GITHUB_SHA']
          def version_asset(match):
              prefix,quote,url=match.group(1),match.group(2),match.group(3)
              parts=urlsplit(url)
              if parts.scheme or parts.netloc or not parts.path.lower().endswith(('.css','.js')):
                  return match.group(0)
              query=[(k,v) for k,v in parse_qsl(parts.query,keep_blank_values=True) if k!='v']
              query.append(('v',sha))
              updated=urlunsplit((parts.scheme,parts.netloc,parts.path,urlencode(query),parts.fragment))
              return prefix+quote+updated+quote
          for p in out.glob('*.html'):
              text=p.read_text(encoding='utf-8')
              tags=f'<link rel="stylesheet" href="design/nav-brand.css?v={sha}"><script defer src="design/nav-brand.js?v={sha}"></script><script defer src="design/style-debug.js?v={sha}"></script><script defer src="design/neutral-food-diary.js?v={sha}"></script>'
              assert '</head>' in text,str(p)
              text=text.replace('</head>',tags+'\n</head>')
              if p.name == 'index.html':
                  assert (out/'diary-energy.js').is_file(), 'Missing diary-energy.js'
                  assert '</body>' in text, 'Missing closing body tag'
                  pattern=r"<script\b[^>]*\bsrc\s*=\s*(['\"])(?:\./|/)?diary-energy\.js(?:[?#][^'\"]*)?\1[^>]*>\s*</script>"
                  text=re.sub(pattern,'',text,flags=re.IGNORECASE)
                  text=text.replace('</body>',f'<script src="diary-energy.js?v={sha}"></script>\n</body>')
                  assert len(re.findall(pattern,text,flags=re.IGNORECASE)) == 1, 'Expected one diary-energy.js connection'
              text=re.sub(r"(\b(?:href|src)\s*=\s*)(['\"])([^'\"]+)\2",version_asset,text,flags=re.IGNORECASE)
              p.write_text(text,encoding='utf-8')
          (out/'.nojekyll').touch()
          (out/'deployment-info.json').write_text(json.dumps({'branch':'main','commit':sha})+'\n',encoding='utf-8')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
