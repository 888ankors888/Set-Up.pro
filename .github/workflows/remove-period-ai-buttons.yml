name: Remove legacy period AI buttons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-period-ai-buttons.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy buttons and validate scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('index.html')
          html=p.read_text()
          pattern=r'<button\b[^>]*\bonclick="aiReport\([^"]*\)"[^>]*>[\s\S]*?</button>'
          html,count=re.subn(pattern,'',html)
          assert count == 1, f'Expected one shared legacy button template, found {count}'
          assert 'onclick="foodReportAnalyze()"' in html
          assert 'id="food-report-ai"' not in html or 'foodReportPeriod' in html
          assert 'onclick="aiReport(' not in html
          for js in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',html):
              if not js.strip():
                  continue
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
                  f.write(js)
                  f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
          p.write_text(html)
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/remove-period-ai-buttons.yml
          git commit -m "Remove legacy AI analysis buttons from month and week cards"
          git push origin HEAD:main
