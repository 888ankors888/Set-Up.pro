name: Workouts store tests
on:
  push:
    branches: [main]
    paths: ['workouts/**', '.github/workflows/workouts-store-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check workouts/store.js
      - run: node --test workouts/tests/store.test.cjs
