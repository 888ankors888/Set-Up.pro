name: Repair and apply reviewed goals updates
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-goals-update.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Fix only quoting and execute reviewed checks
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import textwrap
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='8a3978883e5f6fe277a5f19db78b97b54bf3dd11', 'Repository changed; review required'
          path=Path('.github/workflows/update-goals-habits-v2.yml')
          lines=path.read_text(encoding='utf-8').splitlines()
          matches=[i for i,line in enumerate(lines) if line.strip().startswith('edit(h,') and 'Удобное время, необязательно' in line]
          assert len(matches)==1
          old='''<label for="'+uid+'-time">Удобное время, необязательно</label><input id="'+uid+'-time" data-habit-time type="time"'''
          new='''<input id="'+uid+'-time" data-habit-time type="hidden"'''
          lines[matches[0]]='          edit(h,'+repr(old)+','+repr(new)+')'
          repaired='\n'.join(lines)+'\n'
          script=textwrap.dedent(repaired.split('        run: |\n',1)[1].split('      - name: Commit only validated questionnaire changes',1)[0])
          compiled=compile(script,'reviewed-goals-update','exec')
          exec(compiled,{})
      - name: Commit only validated application files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goals-nutrition.js goals-habits.js habit-tracker.js
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert sorted(files)==['goals-habits.js','goals-nutrition.js','habit-tracker.js'], files
          PY
          git commit -m 'feat(goals): apply validated fastfood and mental habit updates'
          git push origin HEAD:main
