name: Improve sports plan validation diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-sports-validation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch sports schema, safe errors and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, subprocess
          p=Path('backend/sports_api.py')
          api=p.read_text()
          assert 'class SportsPlan(BaseModel):' in api
          api=api.replace('from pydantic import BaseModel, Field','from pydantic import BaseModel, Field\nfrom sports_normalization import NormalizedPlan',1)
          api=api.replace('class SportsPlan(BaseModel):','class SportsPlan(NormalizedPlan):',1)
          old='        plan=generate(SimpleNamespace(text=payload.model_dump_json()),request,PROMPT,SportsPlan,4000)'
          assert api.count(old)==1
          new="        schema_prompt=PROMPT+'\\nОбязательная JSON-схема ответа: '+json.dumps(SportsPlan.model_json_schema(),ensure_ascii=False)+'\\nВсе обязательные поля нужны. Не используй null для обязательных полей. repetitions — строка, sets и minutes — целые числа; weekday 0=понедельник, 6=воскресенье.'\n        plan=generate(SimpleNamespace(text=payload.model_dump_json()),request,schema_prompt,SportsPlan,4000)"
          api=api.replace(old,new,1)
          assert 'any((d+1)%7 in strength for d in strength)' in api
          ast.parse(api)
          p.write_text(api)
          p=Path('backend/main.py')
          main=p.read_text()
          marker='from pydantic import BaseModel, Field, model_validator'
          assert main.count(marker)==1 and 'safe_validation_fields' not in main
          main=main.replace(marker,marker+'\nfrom sports_normalization import safe_validation_fields',1)
          main=main.replace('def safe_error(exc, stage):','def safe_error(exc, stage):\n    validation=safe_validation_fields(exc)',1)
          marker="    logger.warning('food_api_error %s', json.dumps(detail, ensure_ascii=True))"
          assert main.count(marker)==1
          main=main.replace(marker,"    if validation:\n        detail['validation_fields']=validation\n"+marker,1)
          ast.parse(main)
          p.write_text(main)
          p=Path('sports/sports-ui.js')
          original=p.read_text()
          js=original
          marker=' window.sportsGenerate=async function()'
          assert js.count(marker)==1
          helper=" function sportsPlanError(result,status){if(status!==502)return '';const d=result?.detail;if(d?.stage==='response_validation'){const fields=Array.isArray(d.validation_fields)?d.validation_fields.slice(0,4).map(x=>x.path).join(', '):'';return 'Ответ GigaChat не соответствует формату.'+(fields?' Поля: '+fields+'.':'')+' Повторите запрос.'}if(d?.stage==='gigachat_request')return 'Не удалось получить ответ GigaChat. Повторите позже.';return 'Программа не прошла проверку ограничений. Изменять ограничения ради генерации не нужно; повторите запрос.'}\n"
          js=js.replace(marker,helper+marker,1)
          old='if(!response.ok)throw Error('
          assert js.count(old)==1
          js=js.replace(old,'if(!response.ok)throw Error(sportsPlanError(result,response.status)||',1)
          p.write_text(js)
          subprocess.run(['node','--check',str(p)],check=True)
          index=Path('index.html')
          html=index.read_text()
          assert html.count(original)==1
          index.write_text(html.replace(original,js,1))
          ast.parse(Path('backend/sports_normalization.py').read_text())
          PY
      - name: Run tests without GigaChat requests
        run: |
          python3 -m pip install -r backend/requirements.txt
          PYTHONPATH=backend python3 -m unittest discover -s backend/tests -p 'test_sports_normalization.py' -v
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py backend/sports_api.py sports/sports-ui.js index.html
          git rm .github/workflows/fix-sports-validation.yml
          git commit -m "Fix equivalent sports plan formats and expose safe validation paths"
          git push origin HEAD:main
