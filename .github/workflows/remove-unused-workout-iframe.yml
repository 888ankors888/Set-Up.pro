name: Remove obsolete workout iframe files
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-unused-workout-iframe.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify references and remove only approved files
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          own='.github/workflows/remove-unused-workout-iframe.yml'
          targets=['workouts-program.js','.github/workflows/connect-workouts-program.yml']
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          assert all(Path(p).is_file() for p in targets), 'Expected obsolete files missing; review required'
          blocked=[]
          for name in tracked:
              if not name or name in targets or name==own:
                  continue
              p=Path(name)
              if not p.is_file():
                  continue
              raw=p.read_bytes()
              if b'\0' in raw:
                  continue
              text=raw.decode('utf-8',errors='replace')
              for target in targets:
                  if Path(target).name in text:
                      blocked.append(name+' references '+target)
          assert not blocked, 'References remain; nothing removed:\n'+'\n'.join(blocked)
          html=Path('workouts.html').read_text(encoding='utf-8')
          assert 'workouts/store.js' in html and 'workouts/page.js' in html
          assert '<iframe' not in html.lower()
          assert 'sportQuestionnaire' in Path('goals-sport.js').read_text(encoding='utf-8')
          assert 'function form()' in Path('sports/sports-ui.js').read_text(encoding='utf-8')
          subprocess.run(['node','--check','workouts/store.js'],check=True)
          subprocess.run(['node','--check','workouts/page.js'],check=True)
          subprocess.run(['node','--test','workouts/tests/store.test.cjs'],check=True)
          subprocess.run(['git','rm','--',*targets,own],check=True)
          subprocess.run(['git','diff','--check'],check=True)
      - name: Commit only approved deletions
        shell: python
        run: |
          import subprocess
          expected=sorted(['workouts-program.js','.github/workflows/connect-workouts-program.yml','.github/workflows/remove-unused-workout-iframe.yml'])
          actual=sorted(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected, actual
          status=subprocess.check_output(['git','diff','--cached','--name-status'],text=True)
          assert all(line.startswith('D\t') for line in status.splitlines()), status
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','chore: delete unused workout iframe loader and obsolete installer'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
