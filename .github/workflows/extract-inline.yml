name: Extract inline JavaScript in refactor branch
on:
  push:
    branches: ['refactor/extract-inline']
    paths:
      - '.github/workflows/extract-inline.yml'
      - 'scripts/extract-inline.py'
      - 'scripts/read-legacy-html.cjs'
      - 'tests/extract-inline.test.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refactor-extract-inline
  cancel-in-progress: false
jobs:
  extract:
    if: github.ref == 'refs/heads/refactor/extract-inline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-inline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/extract-inline.py
      - run: node --test tests/restore-data.test.cjs tests/extract-inline.test.cjs
      - name: Check backend syntax and diff
        run: |
          python -c "import ast; from pathlib import Path; ast.parse(Path('backend/main.py').read_text())"
          git diff --check
      - name: Commit generated files only to refactor branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html legacy backend/main.py .github/workflows/publish-emerald-pages.yml tests/restore-data.test.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract inline scripts preserving execution order'
          git push origin HEAD:refs/heads/refactor/extract-inline
