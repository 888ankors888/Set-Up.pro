name: Install weekly and monthly AI reports
on:
  push:
    branches: [main]
    paths: ['.github/workflows/report-ai-install.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install and check report integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, subprocess
          ast.parse(Path('backend/report_api.py').read_text())
          subprocess.run(['node','--check','report-ai.js'],check=True)
          p=Path('backend/main.py')
          source=p.read_text()
          assert 'install_report_routes' not in source
          source+='\nfrom report_api import install_report_routes\ninstall_report_routes(app)\n'
          ast.parse(source)
          p.write_text(source)
          p=Path('index.html')
          html=p.read_text()
          assert '</body>' in html and 'id="food-report-ai"' not in html
          js=Path('report-ai.js').read_text()
          p.write_text(html.replace('</body>','<script>\n'+js+'\n</script>\n</body>',1))
          PY
      - name: Commit installation and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backend/main.py
          git rm .github/workflows/report-ai-install.yml
          git commit -m "Connect goal-aware weekly and monthly AI report endpoint"
          git push origin HEAD:main
