name: Apply concise navigation labels
on:
  push:
    branches: [refactor/code-cleanup]
    paths: [.github/workflows/apply-menu-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/code-cleanup
      - name: Rename navigation labels and check syntax
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re, subprocess
          p = Path('index.html')
          raw = p.read_bytes()
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert actual == 'cfdfe3a70461f3a577f85d7d546d8096cdc6d0af', 'HTML changed; stop rather than overwrite'
          s = raw.decode('utf-8')
          replacements = [
              ("s.textContent='Дневник питания'", "s.textContent='Питание'"),
              ("b.textContent.trim()==='Дневник питания'", "b.textContent.trim()==='Питание'"),
              ("['training','Дневник тренировок']", "['training','Спорт']"),
          ]
          for old, new in replacements:
              assert s.count(old) == 1, 'Unexpected navigation markup: ' + old
              s = s.replace(old, new, 1)
          assert "h.textContent='Дневник питания'" in s
          assert '<h1>Дневник тренировок</h1>' in s
          checked = 0
          for attrs, code in re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>', s):
              if 'src=' in attrs or not code.strip():
                  continue
              subprocess.run(['node', '--check'], input=code, text=True, check=True)
              checked += 1
          assert checked == 21
          p.write_bytes(s.encode('utf-8'))
      - name: Commit labels to refactor branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git diff --cached --quiet && exit 0
          git commit -m "ui: rename navigation buttons to Nutrition and Sport"
          git push origin HEAD:refactor/code-cleanup
