name: Fix native menu icons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-native-menu-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix icon registry instead of reassigning const
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<script id="settings-goals-icons">[\s\S]*?</script>'
          replacement = '''<script id="settings-goals-icons">
          (() => {
            IC.goals = '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>';
            IC.profile = '<path d="m9 3-.5 2-2 .9-1.9-.6-2 3.4 1.5 1.4v2.8L2.6 14l2 3.4 1.9-.6 2 .9.5 2.3h4l.5-2.3 2-.9 1.9.6 2-3.4-1.5-1.1v-2.8l1.5-1.4-2-3.4-1.9.6-2-.9L13 3Z"/><circle cx="11" cy="11.5" r="3"/>';
            render();
          })();
          </script>'''
          updated, count = re.subn(pattern, lambda match: replacement, s)
          assert count == 1, 'Expected exactly one icon script'
          p.write_text(updated, encoding='utf-8')
      - name: Check script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          for js in re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', Path('index.html').read_text(encoding='utf-8')):
              if js.strip():
                  subprocess.run(['node', '--check'], input=js, text=True, check=True)
          PY
      - name: Commit icon fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix My Goals icon using native menu icon registry"
          git push origin HEAD:main
