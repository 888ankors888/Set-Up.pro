name: Connect workouts weekly program
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-workouts-program.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and connect module
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          subprocess.run(['node', '--check', 'workouts-program.js'], check=True)
          p = Path('workouts.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="workouts-program.js?v=1"></script>'
          if tag not in s:
              assert s.count('</html>') == 1
              s = s.replace('</html>', tag + '\n</html>')
              p.write_text(s, encoding='utf-8')
          assert tag in p.read_text(encoding='utf-8')
      - name: Commit page integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workouts.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: connect weekly training program to workouts page'
          git push origin HEAD:main
