name: Group food action buttons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/food-buttons-layout.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add equal-sized grouped action buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          assert 'MEAL_ESTIMATE_API' in html
          assert 'food-action-layout' not in html
          style = '<style id="food-action-layout">.food-action-title{margin:18px 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mu)}.food-action-grid{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;width:100%}.food-action-grid>.btn{display:flex;align-items:center;justify-content:center;width:100%;height:60px;min-width:0;margin:0;padding:10px 12px;border:1px solid transparent;border-radius:14px;font-size:14px;font-weight:600;line-height:1.25;text-align:center;white-space:normal;box-sizing:border-box}.food-action-grid>.food-action-primary{background:var(--ac);color:var(--on)}.food-action-grid>.food-action-secondary{background:var(--ac2);color:var(--ac);border-color:var(--ln)}.food-manual-actions{margin-top:18px;padding-top:2px;border-top:1px solid var(--ln)}@media(max-width:360px){.food-action-grid{gap:8px}.food-action-grid>.btn{height:64px;padding:8px;font-size:13px}}</style>'
          js = r'''(() => {
           function arrangeFoodActions(){
            const card=document.getElementById('meal-estimate');if(!card)return;
            const calc=card.querySelector('button[onclick="meRequest()"]');if(!calc)return;
            const row=calc.parentElement;row.className='food-action-grid';row.style.marginTop='8px';
            calc.className='btn food-action-primary';
            if(!card.querySelector('.food-action-title')){const title=document.createElement('div');title.className='food-action-title';title.textContent='С помощью ИИ';row.before(title)}
            if(!row.querySelector('#food-photo-action')){
             const input=document.createElement('input');input.type='file';input.accept='image/*';input.setAttribute('capture','environment');input.hidden=true;input.style.display='none';input.onchange=()=>onPhoto(input);card.appendChild(input);
             const photo=document.createElement('button');photo.type='button';photo.id='food-photo-action';photo.className='btn food-action-primary';photo.textContent='Рассчитать по фото';photo.onclick=()=>input.click();row.appendChild(photo);
            }
            row.querySelector('#food-photo-action').disabled=calc.disabled;
            if(!card.querySelector('.food-manual-actions')){
             const block=document.createElement('section');block.className='food-manual-actions';
             const title=document.createElement('div');title.className='food-action-title';title.textContent='Вручную';
             const grid=document.createElement('div');grid.className='food-action-grid';
             const product=document.createElement('button');product.type='button';product.className='btn food-action-secondary';product.textContent='＋ Добавить продукт';product.onclick=()=>go('journal');
             const manual=document.createElement('button');manual.type='button';manual.className='btn food-action-secondary';manual.textContent='Ввести своё блюдо';manual.onclick=()=>manualOpen();
             grid.append(product,manual);block.append(title,grid);row.after(block);
            }
            document.querySelectorAll('#app>.quick').forEach(el=>el.remove());
            document.querySelectorAll('#app input[type="file"][onchange*="onPhoto"]').forEach(input=>{const label=input.closest('label');if(!label)return;const caption=label.nextElementSibling;if(caption&&caption.textContent.includes('Положите ладонь'))caption.remove();label.remove()});
           }
           const previousRender=render;render=function(){previousRender();arrangeFoodActions()};
           const previousRefresh=meRefresh;meRefresh=function(){previousRefresh();arrangeFoodActions()};
           arrangeFoodActions();
          })();'''
          with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8') as f:
              f.write(js)
              f.flush()
              subprocess.run(['node', '--check', f.name], check=True)
          assert '</head>' in html and '</body>' in html
          html = html.replace('</head>', style + '\n</head>', 1)
          html = html.replace('</body>', '<script>\n' + js + '\n</script>\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY
      - name: Commit layout and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/food-buttons-layout.yml
          git commit -m "Group equal-sized AI and manual food action buttons"
          git push origin HEAD:main
