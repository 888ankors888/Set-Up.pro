name: Integrate sports program into training diary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/training-diary-sport-layout.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch program placement and navigation icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile
          p=Path('sports/sports-ui.js')
          original=p.read_text()
          js=original
          old="[['sport','Спорт'],['training','Дневник тренировок']]"
          assert js.count(old)==1
          js=js.replace(old,"[['training','Дневник тренировок']]",1)
          old="b.innerHTML='<span>'+label+'</span>'"
          assert js.count(old)==1
          js=js.replace(old,"b.innerHTML=trainingIcon+'<span>'+label+'</span>'",1)
          icon=" const trainingIcon='<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><rect x=\"2\" y=\"8\" width=\"4\" height=\"8\" rx=\"1\"/><rect x=\"6\" y=\"6\" width=\"3\" height=\"12\" rx=\"1\"/><path d=\"M9 12h6\"/><rect x=\"15\" y=\"6\" width=\"3\" height=\"12\" rx=\"1\"/><rect x=\"18\" y=\"8\" width=\"4\" height=\"8\" rx=\"1\"/></svg>';\n"
          assert js.startswith('(() => {\n')
          js=js.replace('(() => {\n','(() => {\n'+icon,1)
          old="const requested=tab,custom=['sport','training'].includes(requested)"
          assert js.count(old)==1
          js=js.replace(old,"const requested=tab==='sport'?'training':tab,custom=['sport','training'].includes(requested)",1)
          old="document.getElementById('app').innerHTML=brand()+(requested==='sport'?sport():diary())"
          assert js.count(old)==1
          new="document.getElementById('app').innerHTML=brand()+diary()+'<section id=\"training-sport-program\" aria-label=\"Спорт и программа тренировок\">'+sport().replace('<h1>Спорт</h1>','<h2>Спорт</h2>')+'</section>'"
          js=js.replace(old,new,1)
          old="window.sportsGo=function(t){if(!['sport','training'].includes(t))return;tab=t;date=today();render();scrollTo(0,0)};"
          assert js.count(old)==1
          new="window.sportsGo=function(t){if(!['sport','training'].includes(t))return;tab='training';date=today();render();if(t==='sport')document.getElementById('training-sport-program')?.scrollIntoView({behavior:'smooth',block:'start'});else scrollTo(0,0)};"
          js=js.replace(old,new,1)
          with tempfile.NamedTemporaryFile(mode='w',suffix='.js') as f:
              f.write(js)
              f.flush()
              subprocess.run(['node','--check',f.name],check=True)
          index=Path('index.html')
          html=index.read_text()
          assert html.count(original)==1
          html=html.replace(original,js,1)
          p.write_text(js)
          index.write_text(html)
          PY
      - name: Commit integration and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports/sports-ui.js index.html
          git rm .github/workflows/training-diary-sport-layout.yml
          git commit -m "Embed sports program below training diary and add dumbbell icon"
          git push origin HEAD:main
