name: Install sports interface stage two
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sports-ui-install.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and integrate sports interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          subprocess.run(['node','--check','sports/sports-ui.js'],check=True)
          assert Path('backend/sports_api.py').is_file()
          p=Path('index.html')
          html=p.read_text()
          assert '</body>' in html and 'sportsValidateImport' not in html
          assert '<button class="btn" onclick="saveForm()">' in html
          marker='waterGoal:Number(d.waterGoal)||2000};'
          assert html.count(marker)==1
          html=html.replace(marker,'waterGoal:Number(d.waterGoal)||2000,sports:window.sportsValidateImport(d.sports)};',1)
          js=Path('sports/sports-ui.js').read_text()
          p.write_text(html.replace('</body>','<script>\n'+js+'\n</script>\n</body>',1))
          doc=Path('sports/README.md')
          text=doc.read_text()
          assert '## Этап 2 — ещё не установлен' in text
          text=text.replace('## Этап 2 — ещё не установлен','## Этап 2 — интерфейс подключён',1)
          text+='\nСпортивные данные хранятся в S.sports (version=1), отдельно от питания, включаются в JSON-копию и проверяются при импорте. Записи редактируются и удаляются. Хранится один текущий план без архива программ; новая генерация заменяет его. План не повторяется автоматически. Выполнение в отчётах относится только к текущей принятой программе; история фактических записей сохраняется. CSV спорта, часы и реабилитация не реализованы.\n'
          doc.write_text(text)
          PY
      - name: Commit integration and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sports/README.md
          git rm .github/workflows/sports-ui-install.yml
          git commit -m "Connect sports profile, program, activity diary and reports"
          git push origin HEAD:main
