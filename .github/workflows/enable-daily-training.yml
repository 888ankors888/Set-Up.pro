name: Enable training page and publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-daily-training.yml']
permissions:
  contents: write
  pages: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r backend/requirements.txt 'pydantic>=2,<3' httpx PyYAML
      - name: Connect existing training modules
        shell: python
        run: |
          from pathlib import Path
          import ast, subprocess
          p=Path('backend/sports_api.py');s=p.read_text()
          if 'install_day_training_routes' not in s:
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='8a26e12274e93b6ef2cbe443aec55056088187fe'
              s=s.rstrip()+'\n\n    from day_training_api import install_day_training_routes\n    install_day_training_routes(app)\n'
              ast.parse(s);p.write_text(s)
          p=Path('today-sport-screens.js');s=p.read_text()
          if 'data-daily-planner' not in s:
              assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='ac810df20ae5214dcb3174876fe1c37d5414dfd3'
              s+='\n(() => {const load=()=>{if(document.querySelector("script[data-daily-planner]"))return;const script=document.createElement("script");script.dataset.dailyPlanner="";script.src=new URL("daily-training.js?v=2",document.baseURI).href;script.onerror=()=>toast("Не удалось загрузить программу тренировок. Обновите страницу.");document.head.appendChild(script);};if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",load,{once:true});else load();})();\n'
              p.write_text(s)
      - name: Validate with mocked AI and real sports validator
        shell: python
        run: |
          from pathlib import Path
          import subprocess,yaml
          workflow=yaml.safe_load(Path('.github/workflows/connect-daily-training.yml').read_text())
          steps={s.get('name'):s for s in workflow['jobs']['check']['steps']}
          for name in ['Check syntax and daily API with mocked provider','Check planning core against real sports validator']:
              step=steps[name]
              cmd=['python','-c',step['run']] if step.get('shell')=='python' else ['bash','-e','-o','pipefail','-c',step['run']]
              subprocess.run(cmd,check=True)
          subprocess.run(['git','diff','--check'],check=True)
      - name: Commit validated integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/sports_api.py today-sport-screens.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat: enable training page and day-specific AI endpoint'
            git push origin HEAD:main
          fi
      - name: Request Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST 'repos/${{ github.repository }}/pages/builds'
