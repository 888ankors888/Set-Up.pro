name: Connect goals questionnaire and preferences
on:
  push:
    branches: [feature/goals-questionnaire]
    paths: [goals-questionnaire.js, goals-preferences.js, .github/workflows/install-goals-questionnaire.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/goals-questionnaire
      - run: |
          node --check goals-questionnaire.js
          node --check goals-preferences.js
      - name: Connect modules in order
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert s.count('</body>') == 1
          assert 'window.foodGoalsPage' in s and 'function formView()' in s
          for name in ('goals-questionnaire.js', 'goals-preferences.js'):
              s = re.sub(r'<script\s+src="' + re.escape(name) + r'\?v=1"></script>\s*', '', s)
          tags = '<script src="goals-questionnaire.js?v=1"></script>\n<script src="goals-preferences.js?v=1"></script>\n'
          s = s.replace('</body>', tags + '</body>', 1)
          for attrs, code in re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>', s):
              if 'src=' not in attrs and code.strip():
                  subprocess.run(['node', '--check'], input=code, text=True, check=True)
          p.write_text(s, encoding='utf-8')
      - name: Commit integration to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: connect questionnaire preference fields"
          git push origin HEAD:feature/goals-questionnaire
