name: Install food photo integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/food-photo-install.yml']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect routes, dependencies and photo button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, subprocess
          main = Path('backend/main.py')
          source = main.read_text(encoding='utf-8')
          registration = '\nfrom photo_api import install_photo_routes\ninstall_photo_routes(app)\n'
          if 'install_photo_routes(app)' not in source:
              source += registration
          ast.parse(source)
          ast.parse(Path('backend/photo_api.py').read_text(encoding='utf-8'))
          subprocess.run(['node', '--check', 'backend/photo-input.js'], check=True)
          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          assert 'MEAL_ESTIMATE_API' in html, 'Expected current meal estimation interface'
          tag = '<script src="https://food-pro-api.onrender.com/photo-input.js?v=1"></script>'
          if tag not in html:
              assert '</body>' in html
              html = html.replace('</body>', tag + '\n</body>', 1)
          requirements = Path('backend/requirements.txt')
          deps = requirements.read_text(encoding='utf-8').rstrip() + '\n'
          for package in ['python-multipart>=0.0.20,<1', 'Pillow>=11,<13']:
              if package.split('>=')[0].lower() not in deps.lower():
                  deps += package + '\n'
          main.write_text(source, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          requirements.write_text(deps, encoding='utf-8')
          PY
      - name: Commit integration and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/main.py backend/requirements.txt index.html
          git rm .github/workflows/food-photo-install.yml
          git commit -m "Connect GigaChat food photo estimation"
          git push origin HEAD:main
