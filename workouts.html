<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренировки — food.pro</title><link rel="stylesheet" href="site-theme.css"><style>*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:24px 16px}header,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.card{margin:18px 0}label{display:grid;gap:6px;margin:10px 0}input,textarea{width:100%}button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:8px 4px;text-align:left}td input[type=checkbox]{width:24px;height:24px}td input[type=number]{min-width:65px}caption{text-align:left}.scroll{overflow-x:auto}.exercise{border:1px solid var(--ln);border-radius:18px;padding:16px;margin:14px 0}.exercise h3{margin:0}#status{min-height:28px;color:var(--ac)}.muted{color:var(--mu)}@media(max-width:600px){main{padding:16px 10px}.exercise{padding:10px}.btn{width:auto}th,td{padding:6px 2px}}</style>
<main><header><a href="index.html">← food.pro</a><h1>Тренировки</h1></header><p class="muted">Личный журнал упражнений и рабочих подходов.</p><p class="muted">Записи сохраняются только в этом браузере, отдельно от спортивного дневника food.pro. Для резервной копии используйте экспорт.</p><section class="card"><h2 id="heading">Новая тренировка</h2><form id="form"><label>Дата<input id="date" type="date" required></label><label>Название<input id="title" maxlength="120" required placeholder="Например, силовая — верх тела"></label><label>Продолжительность, минут<input id="duration" type="number" min="0" max="1440" step="1"></label><div id="exercises"></div><button class="btn s" id="add" type="button">+ Упражнение</button><label>Заметки<textarea id="notes" maxlength="4000" rows="3"></textarea></label><label><span><input id="completed" type="checkbox" style="width:auto"> Тренировка завершена</span></label><div class="actions"><button class="btn" type="submit">Сохранить тренировку</button><button class="btn s" id="reset" type="button">Новая / отменить редактирование</button></div></form><p id="status" role="status" aria-live="polite"></p></section><section class="card"><h2>История</h2><label>Фильтр по дате<input id="filter" type="date"></label><div class="actions"><button class="btn s" id="clearFilter">Все даты</button><button class="btn s" id="export">Экспорт JSON</button></div><p id="summary"></p><div id="history"></div></section></main>
<script>
'use strict';
const KEY='food.pro.workouts.v1';
const $=id=>document.getElementById(id);
let records=[],editing=null,storageReady=true;
function status(text){$('status').textContent=text;}
try{const raw=localStorage.getItem(KEY);records=raw?JSON.parse(raw):[];if(!Array.isArray(records)||records.some(r=>!r||typeof r.id!=='string'||typeof r.date!=='string'||typeof r.title!=='string'||!Array.isArray(r.exercises)||r.exercises.some(e=>!e||typeof e.name!=='string'||!Array.isArray(e.sets)||e.sets.some(s=>!s||typeof s.reps!=='number'||typeof s.weight!=='number'))))throw Error();}catch(e){storageReady=false;records=[];status('Не удалось прочитать журнал. Запись заблокирована, чтобы не затереть данные. Проверьте доступ к хранилищу браузера.');}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function button(text,action,cls='btn s'){const b=el('button',text,cls);b.type='button';b.addEventListener('click',action);return b;}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function addSet(body,set={reps:10,weight:0,done:false}){const row=el('tr');const num=el('td',String(body.children.length+1));row.append(num);for(const [key,label,max,step] of [['reps','Повторения',10000,'1'],['weight','Вес, кг',10000,'0.5']]){const td=el('td'),input=el('input');input.type='number';input.min=key==='reps'?'1':'0';input.max=String(max);input.step=step;input.required=true;input.value=set[key];input.dataset.field=key;input.setAttribute('aria-label',label);td.append(input);row.append(td);}const check=el('input');check.type='checkbox';check.checked=!!set.done;check.dataset.field='done';check.setAttribute('aria-label','Подход выполнен');const cell=el('td');cell.append(check);row.append(cell);const remove=el('td');remove.append(button('Удалить',()=>{row.remove();[...body.children].forEach((r,i)=>r.firstChild.textContent=String(i+1));}));row.append(remove);body.append(row);}
function addExercise(data={name:'',sets:[{reps:10,weight:0,done:false}]}){const box=el('section',undefined,'exercise'),label=el('label','Упражнение'),name=el('input');name.required=true;name.maxLength=120;name.placeholder='Название упражнения';name.value=data.name;name.dataset.name='true';label.append(name);box.append(label);const wrap=el('div',undefined,'scroll'),table=el('table'),head=el('thead'),tr=el('tr');for(const text of ['№','Повторы','Вес, кг','Готово',''])tr.append(el('th',text));head.append(tr);const body=el('tbody');table.append(head,body);wrap.append(table);box.append(wrap);data.sets.forEach(s=>addSet(body,s));const actions=el('div',undefined,'actions');actions.append(button('+ Подход',()=>addSet(body)),button('Удалить упражнение',()=>{if(confirm('Удалить упражнение из текущей формы?'))box.remove();},'btn d'));box.append(actions);$('exercises').append(box);}
function reset(){editing=null;$('form').reset();$('date').value=today();$('heading').textContent='Новая тренировка';$('exercises').replaceChildren();addExercise();}
function persist(next){if(!storageReady){status('Сохранение недоступно: исходные данные не прочитаны.');return false;}try{localStorage.setItem(KEY,JSON.stringify(next));records=next;return true;}catch(e){status('Не удалось сохранить: хранилище недоступно или переполнено. Форма сохранена на экране.');return false;}}
function readExercises(){return [...$('exercises').children].map(box=>({name:box.querySelector('[data-name]').value.trim(),sets:[...box.querySelectorAll('tbody tr')].map(row=>({reps:Number(row.querySelector('[data-field=reps]').value),weight:Number(row.querySelector('[data-field=weight]').value),done:row.querySelector('[data-field=done]').checked}))}));}
$('form').addEventListener('submit',event=>{event.preventDefault();const exercises=readExercises();if(!$('title').value.trim()||!exercises.length||exercises.some(e=>!e.name||!e.sets.length)){status('Укажите название, хотя бы одно упражнение и один подход в каждом упражнении.');return;}if(exercises.some(e=>e.sets.some(s=>!Number.isInteger(s.reps)||s.reps<1||s.reps>10000||!Number.isFinite(s.weight)||s.weight<0||s.weight>10000))){status('Проверьте повторения и вес.');return;}const record={id:editing||crypto.randomUUID(),date:$('date').value,title:$('title').value.trim(),duration:$('duration').value===''?null:Number($('duration').value),notes:$('notes').value,completed:$('completed').checked,exercises,updatedAt:new Date().toISOString()};const next=records.filter(r=>r.id!==record.id).concat(record);if(persist(next)){reset();render();status('Тренировка сохранена в этом браузере.');}});
function edit(record){if(editing!==null||$('title').value.trim()){if(!confirm('Заменить текущую форму выбранной тренировкой?'))return;}editing=record.id;$('heading').textContent='Редактирование тренировки';$('date').value=record.date;$('title').value=record.title;$('duration').value=record.duration??'';$('notes').value=record.notes||'';$('completed').checked=!!record.completed;$('exercises').replaceChildren();record.exercises.forEach(addExercise);$('heading').scrollIntoView({behavior:'smooth'});}
function render(){const list=records.filter(r=>!$('filter').value||r.date===$('filter').value).sort((a,b)=>b.date.localeCompare(a.date));$('history').replaceChildren();$('summary').textContent='Тренировок: '+list.length+' · Завершено: '+list.filter(r=>r.completed).length;if(!list.length)$('history').append(el('p','Записей пока нет. Добавьте тренировку выше.'));for(const r of list){const card=el('article',undefined,'exercise');card.append(el('h3',r.title),el('p',r.date+' · '+(r.completed?'Завершена':'В процессе')+(r.duration!=null?' · '+r.duration+' мин':'')));let volume=0,done=0;for(const e of r.exercises){card.append(el('h4',e.name));const ul=el('ul');e.sets.forEach((s,i)=>{ul.append(el('li',(i+1)+'. '+s.reps+' повт. × '+s.weight+' кг'+(s.done?' — выполнен':'')));if(s.done){done++;volume+=s.reps*s.weight;}});card.append(ul);}card.append(el('p','Выполнено подходов: '+done+' · Объём по выполненным подходам: '+volume.toLocaleString('ru-RU')+' кг'));if(r.notes)card.append(el('p',r.notes));const actions=el('div',undefined,'actions');actions.append(button('Редактировать',()=>edit(r)),button('Удалить',()=>{if(confirm('Удалить тренировку «'+r.title+'» за '+r.date+'?')&&persist(records.filter(x=>x.id!==r.id))){if(editing===r.id)reset();render();status('Тренировка удалена.');}},'btn d'));card.append(actions);$('history').append(card);}}
$('add').addEventListener('click',()=>addExercise());$('reset').addEventListener('click',()=>{if(confirm('Очистить текущую форму? Несохранённые изменения будут потеряны.'))reset();});$('filter').addEventListener('change',render);$('clearFilter').addEventListener('click',()=>{$('filter').value='';render();});$('export').addEventListener('click',()=>{if(!storageReady){status('Экспорт недоступен: исходные записи не прочитаны.');return;}const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),workouts:records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='food-pro-workouts-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});
reset();render();
</script><script src="workouts-program.js?v=1"></script>
</html>
