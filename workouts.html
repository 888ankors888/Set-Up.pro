<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренировки — Set-Up</title><link rel="stylesheet" href="site-theme.css"><style>*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:24px 16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid>.card{margin:0;min-width:0}.item{border-top:1px solid var(--ln);padding-top:12px;margin-top:12px}label{display:grid;gap:6px;margin:12px 0}.check{display:flex;align-items:flex-start;gap:10px}.check input{width:22px;height:22px;flex:none}input,select,textarea{width:100%;box-sizing:border-box}.mu{color:var(--mu)}dialog{width:min(640px,94vw);max-height:90vh;overflow:auto}button{cursor:pointer}.today{border-color:var(--ac)!important}p{overflow-wrap:anywhere;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="design/setup.css?v=1"><script src="design/setup-ui.js?v=1" defer></script>
</head><body><main><a class="setup-home" href="index.html"><img src="assets/setup-mark.svg" alt="" width="46" height="46">Set-Up</a><h1>Тренировки</h1><p id="message" role="status" aria-live="polite"></p><section class="card"><h2>Цели и настройки</h2><p id="settings"></p><p class="mu">Настройки — из существующей анкеты «Мои цели → Спорт». Старые записи пока не очищаются. Совместные отчёты и дневной ИИ подключаются следующим этапом.</p></section><h2>Программа тренировок</h2><div class="toolbar"><button class="btn s" id="previous" type="button">← Неделя</button><button class="btn s" id="current" type="button">Текущая неделя</button><button class="btn s" id="next" type="button">Неделя →</button></div><p id="range"></p><div id="week" class="grid"></div></main><dialog id="dialog"></dialog><script src="workouts/store.js?v=1"></script><script src="workouts/page.js?v=2"></script></body></html>
